<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="800" fill="url(#bg)"/>

  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">CAP 定理：分布式系统只能三选二？其实是个「取舍三角」</text>

  <!-- 顶部三角 -->
  <rect x="70" y="80" width="1260" height="360" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="700" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">CAP 三角</text>

  <polygon points="700,140 370,360 1030,360" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="700" y="165" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">C 一致性</text>
  <text x="700" y="190" text-anchor="middle" font-size="13" fill="#1e40af">所有节点同一时刻</text>
  <text x="700" y="210" text-anchor="middle" font-size="13" fill="#1e40af">看到同一份数据</text>

  <text x="370" y="380" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">A 可用性</text>
  <text x="370" y="403" text-anchor="middle" font-size="13" fill="#047857">每个请求都能</text>
  <text x="370" y="423" text-anchor="middle" font-size="13" fill="#047857">得到响应</text>

  <text x="1030" y="380" text-anchor="middle" font-size="17" font-weight="bold" fill="#7f1d1d">P 分区容错</text>
  <text x="1030" y="403" text-anchor="middle" font-size="13" fill="#b91c1c">网络断了也能</text>
  <text x="1030" y="423" text-anchor="middle" font-size="13" fill="#b91c1c">继续工作</text>

  <!-- 底：两难 -->
  <rect x="70" y="470" width="1260" height="280" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="506" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">网络分区发生时（P 必须选），C 和 A 只能保住一个</text>

  <rect x="110" y="530" width="590" height="95" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="405" y="560" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">选 CP：牺牲可用性</text>
  <text x="130" y="588" text-anchor="start" font-size="13" fill="#991b1b">分区期间拒绝写（返回错误），保证两边数据一致</text>
  <text x="130" y="612" text-anchor="start" font-size="13" fill="#991b1b">代表：ZooKeeper、etcd、Raft/Paxos 系（强一致）</text>

  <rect x="730" y="530" width="590" height="95" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1025" y="560" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">选 AP：牺牲一致性</text>
  <text x="750" y="588" text-anchor="start" font-size="13" fill="#1e40af">两边各自继续服务，数据暂时不一致，事后同步</text>
  <text x="750" y="612" text-anchor="start" font-size="13" fill="#1e40af">代表：Cassandra、Eureka、多数缓存方案（最终一致）</text>

  <rect x="110" y="650" width="1180" height="85" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="130" y="680" text-anchor="start" font-size="14" fill="#431407">💡 类比：你和朋友分别记一份聚餐账目。网络断了没法同步——要么暂停记账（CP，先保证账目一致），</text>
  <text x="130" y="706" text-anchor="start" font-size="14" fill="#431407">要么各自先记、回头再对账（AP，先保证能用）。日常生活一般选后者。</text>
  <text x="130" y="726" text-anchor="start" font-size="13" fill="#92400e">⚠️ 易错点：CAP 不是说「三者只能得二」任意选——P 是客观存在的（网络一定可能断），所以实际是「P 必选，C/A 二选一」。</text>
</svg>
