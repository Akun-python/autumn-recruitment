<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="800" fill="url(#bg)"/>

  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">虚拟内存分页：逻辑地址 → 页表 → 物理地址</text>

  <!-- 左：逻辑地址空间 -->
  <rect x="70" y="100" width="360" height="300" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="250" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">进程的逻辑地址空间</text>
  <text x="250" y="156" text-anchor="middle" font-size="13" fill="#0369a1">（虚拟的，看着很大很整齐）</text>

  <rect x="110" y="175" width="280" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="199" text-anchor="middle" font-size="15" fill="#0c4a6e">页 0（0x0000–0x0FFF）</text>
  <text x="250" y="219" text-anchor="middle" font-size="13" fill="#075985">4 KB</text>

  <rect x="110" y="235" width="280" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="259" text-anchor="middle" font-size="15" fill="#0c4a6e">页 1（0x1000–0x1FFF）</text>
  <text x="250" y="279" text-anchor="middle" font-size="13" fill="#075985">4 KB</text>

  <rect x="110" y="295" width="280" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="250" y="319" text-anchor="middle" font-size="15" fill="#0c4a6e">页 2（0x2000–0x2FFF）</text>
  <text x="250" y="339" text-anchor="middle" font-size="13" fill="#075985">4 KB</text>

  <!-- 中间：页表 -->
  <rect x="560" y="100" width="340" height="300" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="730" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#78350f">页表（每进程一张）</text>
  <text x="730" y="156" text-anchor="middle" font-size="13" fill="#92400e">虚拟页号 → 物理页框号</text>

  <rect x="600" y="175" width="260" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="201" text-anchor="middle" font-size="15" fill="#78350f">页 0 → 页框 5</text>

  <rect x="600" y="222" width="260" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="248" text-anchor="middle" font-size="15" fill="#78350f">页 1 → 页框 3</text>

  <rect x="600" y="269" width="260" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="730" y="295" text-anchor="middle" font-size="15" fill="#78350f">页 2 → 页框 8</text>

  <rect x="600" y="316" width="260" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="730" y="342" text-anchor="middle" font-size="15" fill="#b91c1c">页 3 → 不在内存</text>
  <text x="730" y="362" text-anchor="middle" font-size="12" fill="#b91c1c">（缺页！触发磁盘换入）</text>

  <!-- 右：物理内存 -->
  <rect x="1030" y="100" width="300" height="300" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1180" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">物理内存（真内存）</text>
  <text x="1180" y="156" text-anchor="middle" font-size="13" fill="#166534">按页框存放，可零散</text>

  <rect x="1070" y="175" width="220" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1180" y="201" text-anchor="middle" font-size="15" fill="#14532d">页框 3 ← 页 1</text>

  <rect x="1070" y="222" width="220" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1180" y="248" text-anchor="middle" font-size="15" fill="#14532d">页框 5 ← 页 0</text>

  <rect x="1070" y="269" width="220" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1180" y="295" text-anchor="middle" font-size="15" fill="#14532d">页框 8 ← 页 2</text>

  <!-- 箭头 -->
  <line x1="390" y1="201" x2="560" y2="201" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="390" y1="261" x2="560" y2="261" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="390" y1="321" x2="560" y2="321" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>

  <line x1="900" y1="195" x2="1070" y2="195" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="860" y1="290" x2="1070" y2="290" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="900" y1="242" x2="1070" y2="242" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="700" y="90" text-anchor="middle" font-size="13" fill="#0284c7">① 查页表</text>
  <text x="1010" y="250" text-anchor="middle" font-size="13" fill="#16a34a">② 换算出物理地址</text>

  <!-- 底部：缺页流程 -->
  <rect x="70" y="430" width="1260" height="320" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="468" text-anchor="middle" font-size="18" font-weight="bold" fill="#334155">访问「不在内存」的页 → 缺页中断流程（Page Fault）</text>

  <rect x="110" y="495" width="200" height="90" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="210" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">① 缺页中断</text>
  <text x="210" y="548" text-anchor="middle" font-size="12" fill="#991b1b">CPU 停下当前指令</text>
  <text x="210" y="568" text-anchor="middle" font-size="12" fill="#991b1b">交给内核处理</text>

  <line x1="310" y1="540" x2="370" y2="540" stroke="#ef4444" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="370" y="495" width="200" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">② 查磁盘找页</text>
  <text x="470" y="548" text-anchor="middle" font-size="12" fill="#92400e">在磁盘（虚拟内存</text>
  <text x="470" y="568" text-anchor="middle" font-size="12" fill="#92400e">交换区）找到该页</text>

  <line x1="570" y1="540" x2="630" y2="540" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="630" y="495" width="200" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="730" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">③ 换入内存</text>
  <text x="730" y="548" text-anchor="middle" font-size="12" fill="#075985">读入空闲页框</text>
  <text x="730" y="568" text-anchor="middle" font-size="12" fill="#075985">并更新页表</text>

  <line x1="830" y1="540" x2="890" y2="540" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="890" y="495" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="990" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">④ 重新执行</text>
  <text x="990" y="548" text-anchor="middle" font-size="12" fill="#166534">指令重放，访问成功</text>

  <text x="700" y="620" text-anchor="middle" font-size="13" fill="#475569">如果内存已满：先按淘汰算法（LRU 等）把某页写回磁盘——这叫「换页/页面置换」</text>

  <rect x="110" y="650" width="1180" height="90" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="130" y="682" text-anchor="start" font-size="14" fill="#431407">💡 类比：图书馆借书。逻辑地址空间 = 图书目录（写得满满当当）；页表 = 索引卡（哪本书在哪个书架）；</text>
  <text x="130" y="706" text-anchor="start" font-size="14" fill="#431407">缺页 = 想看的书不在架上，得去仓库（磁盘）调。程序以为自己有无限书架，实际只有一小面墙——这就是「虚拟内存」。</text>
  <text x="130" y="730" text-anchor="start" font-size="14" fill="#431407">⚠️ 易错点：虚拟内存 ≠ 真的变多了内存，它是「借磁盘当仓库」，频繁缺页会变慢（颠簸 thrashing）。</text>
</svg>
