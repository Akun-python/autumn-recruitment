<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="800" fill="url(#bg)"/>

  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">一致性哈希：节点增减时，尽量少的数据发生迁移</text>

  <!-- 左：环形空间 -->
  <rect x="70" y="80" width="620" height="420" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="380" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#4c1d95">① 一致性哈希环（0~2³²-1）</text>

  <!-- 环 -->
  <circle cx="380" cy="280" r="150" fill="#faf5ff" stroke="#a855f7" stroke-width="3"/>
  <circle cx="380" cy="280" r="90" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 节点在环上 -->
  <circle cx="380" cy="130" r="26" fill="#7c3aed"/>
  <text x="380" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">N1</text>
  <circle cx="530" cy="280" r="26" fill="#7c3aed"/>
  <text x="530" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">N2</text>
  <circle cx="380" cy="430" r="26" fill="#7c3aed"/>
  <text x="380" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">N3</text>
  <circle cx="230" cy="280" r="26" fill="#7c3aed"/>
  <text x="230" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">N4</text>

  <!-- key 位置 -->
  <circle cx="310" cy="195" r="14" fill="#f59e0b"/>
  <text x="310" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">K1</text>
  <circle cx="455" cy="380" r="14" fill="#f59e0b"/>
  <text x="455" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">K2</text>
  <circle cx="300" cy="360" r="14" fill="#f59e0b"/>
  <text x="300" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">K3</text>

  <text x="380" y="475" text-anchor="middle" font-size="13" fill="#6d28d9">节点与 key 都哈希到环上</text>
  <text x="380" y="497" text-anchor="middle" font-size="13" fill="#6d28d9">key 顺时针找到的第一个节点 = 归属节点</text>

  <!-- 右：迁移对比 -->
  <rect x="740" y="80" width="590" height="420" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1035" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">② 增加节点 N5：只迁移一部分数据</text>

  <circle cx="700" cy="180" r="22" fill="#16a34a"/>
  <text x="700" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">N5</text>
  <circle cx="1035" cy="180" r="22" fill="#94a3b8"/>
  <text x="1035" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">N3</text>

  <rect x="790" y="215" width="500" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1040" y="240" text-anchor="middle" font-size="14" fill="#78350f">N5 插入在 N3 与 N4 之间</text>
  <text x="1040" y="262" text-anchor="middle" font-size="13" fill="#92400e">→ 只有 N3↔N4 之间的 key 迁移到 N5</text>

  <rect x="790" y="290" width="500" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1040" y="316" text-anchor="middle" font-size="14" fill="#14532d">普通取模（hash % n）呢？</text>
  <text x="1040" y="340" text-anchor="middle" font-size="13" fill="#166534">n 从 4 变 5，几乎全部 key 重新分配 → 缓存全失效（缓存雪崩）</text>

  <rect x="790" y="380" width="500" height="95" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1040" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">③ 虚拟节点：解决数据倾斜</text>
  <text x="810" y="434" text-anchor="start" font-size="13" fill="#1e40af">每个物理节点在环上放 100~200 个虚拟点，</text>
  <text x="810" y="456" text-anchor="start" font-size="13" fill="#1e40af">让各节点负责的区间更均匀，节点增减也更平滑</text>

  <!-- 底 -->
  <rect x="70" y="530" width="1260" height="220" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="700" y="566" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a3412">核心要点与面试追问</text>
  <text x="120" y="598" text-anchor="start" font-size="14" fill="#431407">① 原理：把服务器哈希到一个圆环，key 顺时针找第一个服务器；增删节点只影响环上相邻区间</text>
  <text x="120" y="626" text-anchor="start" font-size="14" fill="#431407">② 与取模的区别：取模在节点数变化时几乎全部数据失效；一致性哈希只迁移 1/n 左右</text>
  <text x="120" y="654" text-anchor="start" font-size="14" fill="#431407">③ 经典应用：Redis Cluster 槽位分配、Memcached 客户端、分布式存储分片</text>
  <text x="120" y="682" text-anchor="start" font-size="14" fill="#431407">④ 虚拟节点：每个物理节点映射多个虚拟点，平衡负载并减少「热点」</text>
  <text x="120" y="710" text-anchor="start" font-size="14" fill="#431407">💡 类比：环形车站。车站在环路上等距分布，乘客按「顺时针第一个车站」上车；新开一站只影响</text>
  <text x="120" y="734" text-anchor="start" font-size="14" fill="#431407">它前后一小段乘客，其他人照常——而不是所有乘客重新分配车站。</text>
</svg>
