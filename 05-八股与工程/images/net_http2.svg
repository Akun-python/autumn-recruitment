<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="800" fill="url(#bg)"/>

  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">HTTP/1.1 vs HTTP/2：多路复用解决了什么问题</text>

  <!-- 左：HTTP/1.1 -->
  <rect x="70" y="90" width="620" height="330" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
  <text x="380" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#7f1d1d">HTTP/1.1：一个连接一次只能传一个请求</text>

  <!-- 浏览器与服务器 -->
  <rect x="110" y="150" width="130" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="175" y="178" text-anchor="middle" font-size="14" fill="#7f1d1d">浏览器</text>
  <text x="175" y="200" text-anchor="middle" font-size="12" fill="#991b1b">发起请求</text>

  <rect x="520" y="150" width="130" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="585" y="178" text-anchor="middle" font-size="14" fill="#7f1d1d">服务器</text>
  <text x="585" y="200" text-anchor="middle" font-size="12" fill="#991b1b">逐个响应</text>

  <!-- 串行请求 -->
  <rect x="280" y="240" width="200" height="30" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="380" y="260" text-anchor="middle" font-size="12" fill="#7f1d1d">请求 A → 响应 A</text>
  <rect x="280" y="278" width="200" height="30" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="380" y="298" text-anchor="middle" font-size="12" fill="#7f1d1d">请求 B → 响应 B</text>
  <rect x="280" y="316" width="200" height="30" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="380" y="336" text-anchor="middle" font-size="12" fill="#7f1d1d">请求 C → 响应 C</text>

  <text x="380" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">队头阻塞（Head-of-Line）</text>
  <text x="380" y="414" text-anchor="middle" font-size="13" fill="#991b1b">A 慢，B、C 全堵在后面排队</text>

  <!-- 右：HTTP/2 -->
  <rect x="740" y="90" width="590" height="330" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1035" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532d">HTTP/2：一条连接上多路复用（帧交错）</text>

  <rect x="780" y="150" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="845" y="178" text-anchor="middle" font-size="14" fill="#14532d">浏览器</text>
  <text x="845" y="200" text-anchor="middle" font-size="12" fill="#166534">同时发 A、B、C</text>

  <rect x="1160" y="150" width="130" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1225" y="178" text-anchor="middle" font-size="14" fill="#14532d">服务器</text>
  <text x="1225" y="200" text-anchor="middle" font-size="12" fill="#166534">交错返回</text>

  <!-- 多路复用示意 -->
  <rect x="950" y="240" width="130" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="1015" y="257" text-anchor="middle" font-size="12" fill="#14532d">A 的帧1</text>
  <rect x="950" y="270" width="130" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="1015" y="287" text-anchor="middle" font-size="12" fill="#14532d">B 的帧1</text>
  <rect x="950" y="300" width="130" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="1015" y="317" text-anchor="middle" font-size="12" fill="#14532d">C 的帧1</text>
  <rect x="950" y="330" width="130" height="24" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <text x="1015" y="347" text-anchor="middle" font-size="12" fill="#14532d">A 的帧2</text>

  <line x1="910" y1="185" x2="965" y2="250" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="910" y1="185" x2="965" y2="280" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="910" y1="185" x2="965" y2="310" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="1035" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">帧按 stream id 归组，交错传输互不阻塞</text>
  <text x="1035" y="414" text-anchor="middle" font-size="13" fill="#166534">一条 TCP 连接承载所有资源，减少握手次数</text>

  <!-- 底部 -->
  <rect x="70" y="450" width="1260" height="300" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="700" y="488" text-anchor="middle" font-size="18" font-weight="bold" fill="#9a3412">关键概念与易错点</text>
  <text x="120" y="528" text-anchor="start" font-size="14" fill="#431407">① 二进制分帧：HTTP/2 把消息切成小「帧」，每帧带 stream id；同一连接的帧可交错发送、按 id 重组。</text>
  <text x="120" y="558" text-anchor="start" font-size="14" fill="#431407">② 头部压缩（HPACK）：重复的请求头不再逐条重发，用静态表+动态表压缩，明显减体积。</text>
  <text x="120" y="588" text-anchor="start" font-size="14" fill="#431407">③ 服务器推送：服务器可主动把客户端可能用到的资源（如 CSS/图片）先推过去，省一次往返。</text>
  <text x="120" y="618" text-anchor="start" font-size="14" fill="#431407">④ 优先级：不同 stream 可设权重，重要资源先传。</text>
  <text x="120" y="648" text-anchor="start" font-size="14" fill="#431407">⚠️ 易错点 1：HTTP/2 解决了应用层队头阻塞，但底层 TCP 丢包时仍会阻塞——这叫 TCP 层队头阻塞，HTTP/3</text>
  <text x="120" y="678" text-anchor="start" font-size="14" fill="#431407">改用 QUIC/UDP 才彻底解决。</text>
  <text x="120" y="708" text-anchor="start" font-size="14" fill="#431407">⚠️ 易错点 2：多路复用 ≠ 并发多连接——HTTP/2 刻意只用一条连接（浏览器 6 条变 1 条）。</text>
</svg>
