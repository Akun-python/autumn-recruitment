<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#37474f"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fafbfc"/>

  <!-- 标题 -->
  <text x="450" y="38" font-size="21" font-weight="bold" fill="#1c2833" text-anchor="middle">RSI 闭环：让阿零自己设计「怎么改自己」</text>
  <text x="450" y="61" font-size="13" fill="#78909c" text-anchor="middle">改进器（improver）本身也是被改进的对象 —— 一圈比一圈会改</text>

  <!-- 安全边界外框 -->
  <rect x="40" y="84" width="820" height="392" rx="18" fill="none" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="54" y="104" font-size="12" fill="#607d8b">安全边界：沙箱执行 · 审计留痕 · 能力门槛 · 人工闸门</text>

  <!-- ① 生成候选 -->
  <rect x="62" y="126" width="196" height="86" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="156" font-size="15" font-weight="bold" fill="#0d47a1" text-anchor="middle">① 生成候选</text>
  <text x="160" y="178" font-size="12" fill="#1565c0" text-anchor="middle">自写 prompt / 改代码</text>
  <text x="160" y="196" font-size="12" fill="#1565c0" text-anchor="middle">自出题 / 自造算法草稿</text>

  <!-- ② 执行与验证 -->
  <rect x="642" y="126" width="196" height="86" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="740" y="156" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">② 执行与验证</text>
  <text x="740" y="178" font-size="12" fill="#2e7d32" text-anchor="middle">跑测试 / verifier 判分</text>
  <text x="740" y="196" font-size="12" fill="#2e7d32" text-anchor="middle">LLM-judge 只能当弱信号</text>

  <!-- ③ 打分归档 archive -->
  <rect x="634" y="266" width="212" height="104" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="740" y="294" font-size="15" font-weight="bold" fill="#e65100" text-anchor="middle">③ 打分与归档 archive</text>
  <text x="740" y="316" font-size="12" fill="#ef6c00" text-anchor="middle">保留 top-k · 彼此要有差异</text>
  <text x="740" y="334" font-size="12" fill="#ef6c00" text-anchor="middle">高分 ≠ 全局最优，可能只是</text>
  <text x="740" y="352" font-size="12" fill="#ef6c00" text-anchor="middle">找到了「局部山头」</text>

  <!-- ④ 变异与选择 -->
  <rect x="352" y="382" width="196" height="82" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="450" y="412" font-size="15" font-weight="bold" fill="#4a148c" text-anchor="middle">④ 变异与选择</text>
  <text x="450" y="434" font-size="12" fill="#6a1b9a" text-anchor="middle">交叉 / 变异 / 重采样</text>
  <text x="450" y="452" font-size="12" fill="#6a1b9a" text-anchor="middle">从 archive 里挑父代</text>

  <!-- ⑤ 写回自身 -->
  <rect x="62" y="266" width="196" height="104" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="160" y="292" font-size="15" font-weight="bold" fill="#263238" text-anchor="middle">⑤ 写回自身</text>
  <text x="160" y="314" font-size="12" fill="#455a64" text-anchor="middle">L1 上下文 · L2 代码</text>
  <text x="160" y="332" font-size="12" fill="#455a64" text-anchor="middle">L3 权重 · L4 算法</text>
  <text x="160" y="352" font-size="12" fill="#607d8b" text-anchor="middle">改完立刻回到 ① 再来一圈</text>

  <!-- 主环路箭头 -->
  <line x1="258" y1="169" x2="634" y2="169" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="446" y="148" font-size="12" fill="#37474f" text-anchor="middle">候选包（一批程序 / 一批做法）</text>

  <line x1="740" y1="212" x2="740" y2="260" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="634" y1="322" x2="556" y2="392" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="582" y="366" font-size="11" fill="#37474f" text-anchor="middle">top-k 精英</text>

  <line x1="352" y1="424" x2="266" y2="396" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="160" y1="266" x2="160" y2="218" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 危险支路：无闸门坍塌 -->
  <rect x="336" y="180" width="238" height="118" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="455" y="206" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">⚠️ 无闸门时的坍塌支路</text>
  <text x="455" y="230" font-size="12" fill="#c62828" text-anchor="middle">unique 比例 ↓ · 多样性 ↓</text>
  <text x="455" y="250" font-size="12" fill="#c62828" text-anchor="middle">模型坍塌 model collapse</text>
  <text x="455" y="270" font-size="12" fill="#c62828" text-anchor="middle">奖励黑客 reward hacking</text>
  <text x="455" y="288" font-size="12" fill="#ad1457" text-anchor="middle">越改越自信，越改越窄</text>

  <!-- 危险支路箭头 -->
  <path d="M642,196 C606,198 594,202 578,208" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <path d="M470,298 C470,330 476,356 482,378" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="494" y="344" font-size="11" fill="#c62828">退化样本直接回灌</text>

  <!-- 改进器自我修改的反馈（蓝色） -->
  <path d="M160,266 C160,240 214,226 296,222" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="196" y="252" font-size="11" fill="#1565c0">连『改自己』的方法也改 → 递归</text>

  <!-- 底部结论 -->
  <text x="450" y="508" font-size="13" fill="#455a64" text-anchor="middle">闭环能转起来 ≠ 会变强：信号可信 + 多样性保得住 + 随时能回滚，三者缺一，转得越快歪得越快</text>
  <text x="450" y="536" font-size="12" fill="#90a4ae" text-anchor="middle">对应第 11 章：L1 上下文 → L2 脚手架 → L3 权重 → L4 算法；archive 保多样性，verifier 保真，沙箱保命</text>
</svg>
