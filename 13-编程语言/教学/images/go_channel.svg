<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <linearGradient id="send" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f1ff"/><stop offset="1" stop-color="#d5e8ff"/></linearGradient>
    <linearGradient id="recv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f8ee"/><stop offset="1" stop-color="#d2efdf"/></linearGradient>
    <linearGradient id="chan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4e2"/><stop offset="1" stop-color="#ffe6bf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#183b56" flood-opacity=".12"/></filter>
    <marker id="aBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#3b6ea8"/></marker>
    <marker id="aGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2f9b68"/></marker>
    <marker id="aGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#718096"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#1f2d3d}.title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#64748b}.section{font-size:20px;font-weight:700}.label{font-size:15px;fill:#60758b}.small{font-size:14px;fill:#61748a}.value{font-size:20px;font-weight:700}.code{font-family:ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace;font-size:18px}.pill{font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/><circle cx="1300" cy="95" r="105" fill="#dbeafe" opacity=".58"/><circle cx="70" cy="735" r="130" fill="#dcfce7" opacity=".45"/>
  <text x="70" y="68" class="title">Go channel：通信即同步</text><text x="70" y="101" class="subtitle">发送者与接收者通过 channel 交换值；缓冲区决定“何时阻塞”</text>
  <rect x="70" y="132" width="1260" height="300" rx="20" fill="#fff" filter="url(#shadow)"/><text x="98" y="169" class="section">发送 → channel → 接收：值传递与同步发生在同一条路径</text>
  <g transform="translate(105,215)"><rect width="260" height="145" rx="18" fill="url(#send)" stroke="#8db7e7" stroke-width="2"/><text x="25" y="36" class="label">生产者 goroutine</text><text x="25" y="82" class="code" fill="#245e9b">ch &lt;- v</text><text x="25" y="119" class="small">发送：放入缓冲或等待接收</text></g>
  <path d="M390,287 H470" stroke="#3b6ea8" stroke-width="4" marker-end="url(#aBlue)"/><text x="430" y="267" text-anchor="middle" class="pill" fill="#315c91">发送</text>
  <g transform="translate(500,198)"><rect width="400" height="180" rx="20" fill="url(#chan)" stroke="#e8b367" stroke-width="2"/><text x="30" y="38" class="label">channel（管道）</text><text x="30" y="72" class="value">make(chan T, n)</text><rect x="30" y="96" width="340" height="50" rx="12" fill="#fff" opacity=".85" stroke="#f2c985"/><rect x="48" y="111" width="55" height="20" rx="6" fill="#ffd994"/><rect x="112" y="111" width="55" height="20" rx="6" fill="#ffd994"/><rect x="176" y="111" width="55" height="20" rx="6" fill="#ffd994"/><rect x="240" y="111" width="55" height="20" rx="6" fill="#ffeac5"/><text x="310" y="126" class="small">…</text><text x="30" y="169" class="small">缓冲区：先进先出（FIFO）</text></g>
  <path d="M925,287 H1005" stroke="#2f9b68" stroke-width="4" marker-end="url(#aGreen)"/><text x="965" y="267" text-anchor="middle" class="pill" fill="#287b58">接收</text>
  <g transform="translate(1035,215)"><rect width="260" height="145" rx="18" fill="url(#recv)" stroke="#82c69f" stroke-width="2"/><text x="25" y="36" class="label">消费者 goroutine</text><text x="25" y="82" class="code" fill="#21754f">v := &lt;-ch</text><text x="25" y="119" class="small">接收：取值或等待发送</text></g>
  <rect x="70" y="462" width="600" height="278" rx="20" fill="#fff" filter="url(#shadow)"/><text x="98" y="500" class="section">阻塞规则：谁没有对手，谁就等待</text>
  <g transform="translate(100,530)"><rect width="520" height="54" rx="12" fill="#edf5ff" stroke="#aac8e9"/><text x="20" y="34" class="code">无缓冲：ch := make(chan int)</text></g>
  <path d="M360,594 V625" stroke="#718096" stroke-width="3" marker-end="url(#aGray)"/><text x="390" y="614" class="small">必须同时匹配</text>
  <rect x="100" y="638" width="240" height="62" rx="12" fill="#e6f1ff" stroke="#8db7e7"/><text x="220" y="665" text-anchor="middle" class="pill" fill="#2f5e91">发送先到 → 阻塞</text><text x="220" y="686" text-anchor="middle" class="small">直到接收者出现</text>
  <rect x="380" y="638" width="240" height="62" rx="12" fill="#e5f8ee" stroke="#82c69f"/><text x="500" y="665" text-anchor="middle" class="pill" fill="#287b58">接收先到 → 阻塞</text><text x="500" y="686" text-anchor="middle" class="small">直到发送者出现</text>

  <rect x="730" y="462" width="600" height="278" rx="20" fill="#fff" filter="url(#shadow)"/><text x="758" y="500" class="section">关闭流程：close 只由发送方负责</text>
  <g transform="translate(760,532)"><rect width="155" height="52" rx="12" fill="#fff4df" stroke="#f1c77e"/><text x="77" y="33" text-anchor="middle" class="code">close(ch)</text><path d="M170,26 H220" stroke="#cb7925" stroke-width="3" marker-end="url(#aGray)"/><rect x="235" width="170" height="52" rx="12" fill="#f6fafc" stroke="#c6d4df"/><text x="320" y="33" text-anchor="middle" class="pill">不可再发送</text><path d="M420,26 H470" stroke="#718096" stroke-width="3" marker-end="url(#aGray)"/><rect x="485" width="90" height="52" rx="12" fill="#e5f8ee" stroke="#82c69f"/><text x="530" y="33" text-anchor="middle" class="pill">range</text></g>
  <rect x="760" y="614" width="520" height="86" rx="14" fill="#f6fafc" stroke="#d9e5ef"/><text x="782" y="642" class="code">v, ok := &lt;-ch</text><text x="782" y="670" class="small">ok == false：channel 已关闭且已取空</text><text x="782" y="691" class="small">继续接收不会阻塞，得到零值</text>
</svg>