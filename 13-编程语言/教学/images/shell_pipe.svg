<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="bgTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F6F8FC"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="url(#bgTop)"/>
  <ellipse cx="1280" cy="64" rx="250" ry="130" fill="#DBEAFE" opacity="0.45"/>

  <!-- ===== 标题 ===== -->
  <rect x="41" y="46" width="10" height="44" rx="5" fill="#2563EB"/>
  <text x="65" y="80" font-size="36" font-weight="700" fill="#0F172A">Shell 管道：stdin / stdout / stderr 数据流</text>
  <text x="65" y="112" font-size="17" fill="#64748B">cmd1 | cmd2 | cmd3 —— 前一条的 stdout 接后一条的 stdin：并发执行、数据逐条流动、不落盘</text>

  <!-- ===== 标准流小标签 ===== -->
  <rect x="530" y="146" width="340" height="38" rx="19" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="700" y="171" font-size="15" font-weight="600" fill="#1D4ED8" text-anchor="middle">stdin(0) · stdout(1) · stderr(2)</text>

  <!-- ===== 键盘（stdin 来源） ===== -->
  <rect x="58" y="262" width="78" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="66" y="270" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="80" y="270" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="94" y="270" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="108" y="270" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="73" y="282" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="87" y="282" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="101" y="282" width="9" height="7" rx="2" fill="#CBD5E1"/>
  <rect x="115" y="282" width="16" height="7" rx="2" fill="#CBD5E1"/>
  <text x="97" y="330" font-size="12.5" fill="#94A3B8" text-anchor="middle">键盘</text>
  <line x1="138" y1="290" x2="176" y2="290" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="157" y="274" font-size="13" fill="#475569" text-anchor="middle">stdin(0)</text>

  <!-- ===== cmd1 ===== -->
  <rect x="180" y="230" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="200" y="246" width="12" height="12" rx="3" fill="#2563EB"/>
  <text x="222" y="257" font-size="19" font-weight="700" fill="#0F172A">cmd1</text>
  <text x="296" y="257" font-size="13" fill="#64748B">ps -ef</text>
  <line x1="200" y1="276" x2="420" y2="276" stroke="#EEF2F7" stroke-width="2"/>
  <text x="200" y="302" font-size="13.5" fill="#334155">stdin(0) ← 键盘输入</text>
  <text x="200" y="324" font-size="13.5" fill="#334155">stdout(1) → cmd2</text>
  <text x="200" y="346" font-size="13.5" fill="#334155">stderr(2) → 终端</text>

  <!-- ===== cmd2 ===== -->
  <rect x="575" y="230" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="595" y="246" width="12" height="12" rx="3" fill="#0EA5E9"/>
  <text x="617" y="257" font-size="19" font-weight="700" fill="#0F172A">cmd2</text>
  <text x="691" y="257" font-size="13" fill="#64748B">grep python</text>
  <line x1="595" y1="276" x2="815" y2="276" stroke="#EEF2F7" stroke-width="2"/>
  <text x="595" y="302" font-size="13.5" fill="#334155">stdin(0) ← cmd1 的 stdout</text>
  <text x="595" y="324" font-size="13.5" fill="#334155">stdout(1) → cmd3</text>
  <text x="595" y="346" font-size="13.5" fill="#334155">stderr(2) → 终端</text>

  <!-- ===== cmd3 ===== -->
  <rect x="970" y="230" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="990" y="246" width="12" height="12" rx="3" fill="#6366F1"/>
  <text x="1012" y="257" font-size="19" font-weight="700" fill="#0F172A">cmd3</text>
  <text x="1086" y="257" font-size="13" fill="#64748B">grep -v grep</text>
  <line x1="990" y1="276" x2="1210" y2="276" stroke="#EEF2F7" stroke-width="2"/>
  <text x="990" y="302" font-size="13.5" fill="#334155">stdin(0) ← cmd2 的 stdout</text>
  <text x="990" y="324" font-size="13.5" fill="#334155">stdout(1) → 屏幕</text>
  <text x="990" y="346" font-size="13.5" fill="#334155">stderr(2) → 终端</text>

  <!-- ===== 管道箭头 ===== -->
  <line x1="440" y1="290" x2="573" y2="290" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="506" y="272" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">stdout(1)</text>
  <text x="506" y="312" font-size="13" fill="#64748B" text-anchor="middle">stdin(0)</text>
  <line x1="835" y1="290" x2="968" y2="290" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="901" y="272" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">stdout(1)</text>
  <text x="901" y="312" font-size="13" fill="#64748B" text-anchor="middle">stdin(0)</text>

  <!-- ===== 屏幕（stdout 终点） ===== -->
  <line x1="1230" y1="290" x2="1296" y2="290" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1263" y="272" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">stdout(1)</text>
  <rect x="1300" y="256" width="62" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="1306" y="262" width="50" height="36" rx="3" fill="#E0F2FE" stroke="#BAE6FD"/>
  <line x1="1331" y1="304" x2="1331" y2="316" stroke="#94A3B8" stroke-width="3"/>
  <line x1="1318" y1="316" x2="1344" y2="316" stroke="#94A3B8" stroke-width="3"/>
  <text x="1331" y="340" font-size="12.5" fill="#94A3B8" text-anchor="middle">屏幕</text>

  <!-- ===== stderr 不进入管道 ===== -->
  <line x1="310" y1="350" x2="310" y2="376" stroke="#DC2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="322" y="368" font-size="12.5" fill="#B91C1C">stderr(2)</text>
  <line x1="705" y1="350" x2="705" y2="376" stroke="#DC2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="717" y="368" font-size="12.5" fill="#B91C1C">stderr(2)</text>
  <line x1="1100" y1="350" x2="1100" y2="376" stroke="#DC2626" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="1112" y="368" font-size="12.5" fill="#B91C1C">stderr(2)</text>
  <rect x="41" y="388" width="1318" height="42" rx="12" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="700" y="415" font-size="15.5" fill="#B91C1C" text-anchor="middle">stderr(2)：默认直连终端、不进管道 —— 想合并时写 2&gt;&amp;1 或 |&amp;</text>

  <text x="700" y="456" font-size="15" fill="#475569" text-anchor="middle">关键点：管道内每条命令是并发子进程，数据像水流逐条经过；整体速度由最慢的环节决定（tail -f log | grep ERR 可实时过滤）</text>

  <!-- ===== 核心规则 ===== -->
  <rect x="41" y="500" width="640" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="61" y="521" width="8" height="26" rx="4" fill="#2563EB"/>
  <text x="81" y="540" font-size="20" font-weight="700" fill="#1E3A8A">核心规则</text>
  <text x="61" y="578" font-size="15.5" fill="#334155"><tspan font-weight="700" fill="#2563EB">①</tspan>  A | B：A 的 stdout(1) 接 B 的 stdin(0) —— 内存数据流，不落盘</text>
  <text x="61" y="618" font-size="15.5" fill="#334155"><tspan font-weight="700" fill="#2563EB">②</tspan>  并发执行：各命令同时运行，数据逐条流动，可实时过滤</text>
  <text x="61" y="658" font-size="15.5" fill="#334155"><tspan font-weight="700" fill="#2563EB">③</tspan>  stderr(2) 默认不进管道，需要时 2&gt;&amp;1 或 |&amp; 合并</text>
  <text x="61" y="698" font-size="15.5" fill="#334155"><tspan font-weight="700" fill="#2563EB">④</tspan>  退出码只看最后一条命令；set -o pipefail 改为任一失败即失败</text>
  <text x="61" y="738" font-size="15.5" fill="#334155"><tspan font-weight="700" fill="#2563EB">⑤</tspan>  经典链：ps -ef | grep python | grep -v grep | awk '{print $2}'</text>

  <!-- ===== 正反例 ===== -->
  <rect x="719" y="500" width="640" height="280" rx="18" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="739" y="521" width="8" height="26" rx="4" fill="#16A34A"/>
  <text x="759" y="540" font-size="20" font-weight="700" fill="#15803D">正反例</text>
  <text x="739" y="576" font-size="16" font-weight="700" fill="#15803D">✅ 正例</text>
  <text x="739" y="604" font-size="15" fill="#334155">· ps -ef | grep python | grep -v grep —— 经典进程查找链</text>
  <text x="739" y="630" font-size="15" fill="#334155">· cmd 2&gt;&amp;1 | tee log —— stdout+stderr 一起进管道</text>
  <text x="739" y="654" font-size="15" fill="#334155">· cat log | sort | uniq -c | sort -rn —— 统计排序链</text>
  <text x="739" y="692" font-size="16" font-weight="700" fill="#B91C1C">❌ 反例</text>
  <text x="739" y="720" font-size="15" fill="#7F1D1D">· 以为 stderr 也会进管道 → 错误信息悄悄丢失</text>
  <text x="739" y="746" font-size="15" fill="#7F1D1D">· 以为前一条跑完才启动 → 实际是并发执行</text>
  <text x="739" y="770" font-size="15" fill="#7F1D1D">· 不用 pipefail：前段失败后段照跑，整体仍报成功</text>
</svg>
