<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#29425d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#536f8c"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#26394d}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#6a7d90}.h{font-size:23px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#62768a}.mono{font-family:Consolas,"JetBrains Mono",monospace;font-size:16px}</style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/><text x="70" y="64" class="title">HashMap.put：一次键值对如何找到位置</text><text x="70" y="96" class="sub">扰动 hash → 桶索引 → 冲突处理 → 负载因子触发扩容</text>
  <rect x="70" y="132" width="1260" height="106" rx="20" fill="#fff" stroke="#d8e3ed" filter="url(#shadow)"/><text x="102" y="170" class="small">示例</text><text x="102" y="207" class="mono">map.put("java", 17);</text><text x="450" y="170" class="small">核心公式</text><text x="450" y="207" class="mono">h = key.hashCode();  hash = h ^ (h &gt;&gt;&gt; 16);  index = (n - 1) &amp; hash</text>
  <rect x="70" y="280" width="250" height="420" rx="22" fill="#e4f1ff" stroke="#a9d0f1" stroke-width="2" filter="url(#shadow)"/><text x="100" y="326" class="h">① 计算 hash</text><text x="100" y="364" class="small">让高位参与，减少碰撞</text><rect x="100" y="400" width="190" height="82" rx="14" fill="#fff" stroke="#c0ddf4"/><text x="195" y="432" text-anchor="middle" class="body">hashCode()</text><text x="195" y="460" text-anchor="middle" class="small">对象原始哈希</text><path d="M195 490 V530" stroke="#55728f" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="544" width="190" height="94" rx="14" fill="#fff" stroke="#c0ddf4"/><text x="195" y="578" text-anchor="middle" class="body">扰动函数</text><text x="195" y="609" text-anchor="middle" class="mono">h ^ (h &gt;&gt;&gt; 16)</text><path d="M320 490 H370" stroke="#55728f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="380" y="280" width="250" height="420" rx="22" fill="#e8f8f1" stroke="#a9dec8" stroke-width="2" filter="url(#shadow)"/><text x="410" y="326" class="h">② 定位桶</text><text x="410" y="364" class="small">容量 n 通常为 2 的幂</text><rect x="410" y="405" width="190" height="105" rx="14" fill="#fff" stroke="#bfe5d4"/><text x="505" y="438" text-anchor="middle" class="body">index</text><text x="505" y="472" text-anchor="middle" class="mono">(n - 1) &amp; hash</text><text x="505" y="496" text-anchor="middle" class="small">例如 n=16 → 0~15</text><path d="M630 490 H680" stroke="#55728f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="690" y="280" width="350" height="420" rx="22" fill="#fff2df" stroke="#efc987" stroke-width="2" filter="url(#shadow)"/><text x="720" y="326" class="h">③ 桶内冲突处理</text><text x="720" y="364" class="small">先比较 hash，再 equals()</text><rect x="720" y="397" width="290" height="96" rx="14" fill="#fff" stroke="#f1d79f"/><text x="742" y="427" class="body">链表（少量冲突）</text><circle cx="760" cy="458" r="13" fill="#f3b35c"/><circle cx="832" cy="458" r="13" fill="#f3b35c"/><circle cx="904" cy="458" r="13" fill="#f3b35c"/><path d="M775 458 H817 M847 458 H889" stroke="#c88935" stroke-width="3" marker-end="url(#arrow)"/><text x="742" y="481" class="small">新节点挂到桶内，查找平均 O(1)</text><rect x="720" y="520" width="290" height="108" rx="14" fill="#fff" stroke="#f1d79f"/><text x="742" y="550" class="body">红黑树（链表长度 ≥ 8）</text><circle cx="805" cy="586" r="15" fill="#e97765"/><circle cx="760" cy="614" r="12" fill="#ef9b7f"/><circle cx="850" cy="614" r="12" fill="#ef9b7f"/><path d="M797 598 L768 606 M813 598 L842 606" stroke="#b65348" stroke-width="3"/><text x="742" y="650" class="small">容量不足时优先扩容，≥64 才更适合树化</text><path d="M1040 490 H1090" stroke="#55728f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1100" y="280" width="230" height="420" rx="22" fill="#f1eaff" stroke="#cdb8ee" stroke-width="2" filter="url(#shadow)"/><text x="1130" y="326" class="h">④ 扩容</text><text x="1130" y="364" class="small">threshold = n × 0.75</text><rect x="1130" y="405" width="170" height="82" rx="14" fill="#fff" stroke="#d9c9f0"/><text x="1215" y="438" text-anchor="middle" class="body">超过阈值</text><text x="1215" y="466" text-anchor="middle" class="small">容量翻倍</text><path d="M1215 505 V548" stroke="#7860a2" stroke-width="3" marker-end="url(#arrow)"/><rect x="1130" y="562" width="170" height="92" rx="14" fill="#fff" stroke="#d9c9f0"/><text x="1215" y="594" text-anchor="middle" class="body">重新分布</text><text x="1215" y="622" text-anchor="middle" class="small">低位/高位拆分</text>
  <rect x="70" y="730" width="1260" height="40" rx="14" fill="#253c52"/><text x="100" y="757" fill="#fff" font-size="16" font-family="Microsoft YaHei">面试一句话：HashMap = 数组 + 链表/红黑树；默认负载因子 0.75，扩容通常翻倍，线程不安全。</text>
</svg>