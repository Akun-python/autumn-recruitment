<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#29425d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#54708f"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#26394d}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#6a7d90}.h{font-size:23px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#62768a}.mono{font-family:Consolas,"JetBrains Mono",monospace;font-size:16px}</style>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/><text x="70" y="64" class="title">GC 垃圾回收：先判断存活，再选择算法</text><text x="70" y="96" class="sub">从 GC Roots 出发做可达性分析；新生代快回收，老年代低频但代价更高</text>
  <rect x="70" y="132" width="1260" height="94" rx="20" fill="#fff" stroke="#d8e3ed" filter="url(#shadow)"/><text x="102" y="170" class="small">对象是否存活？</text><circle cx="300" cy="173" r="18" fill="#61c69a"/><text x="300" y="179" text-anchor="middle" fill="#fff" font-size="18">✓</text><text x="330" y="179" class="body">可达：保留</text><circle cx="520" cy="173" r="18" fill="#e87878"/><text x="520" y="179" text-anchor="middle" fill="#fff" font-size="18">×</text><text x="550" y="179" class="body">不可达：候选垃圾</text><text x="102" y="207" class="mono">GC Roots = 栈上局部变量 + 静态变量 + 常量引用</text>
  <rect x="70" y="270" width="390" height="400" rx="22" fill="#e5f8ef" stroke="#a9dec8" stroke-width="2" filter="url(#shadow)"/><text x="100" y="316" class="h">① 新生代 Minor GC</text><text x="100" y="350" class="small">对象大多朝生夕死 → 复制算法</text><rect x="100" y="382" width="330" height="72" rx="14" fill="#fff" stroke="#bfe5d4"/><text x="125" y="412" class="body">Eden</text><text x="125" y="438" class="small">新对象出生地</text><path d="M265 458 V493" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="505" width="150" height="70" rx="14" fill="#fff" stroke="#bfe5d4"/><text x="175" y="536" text-anchor="middle" class="body">S0</text><text x="175" y="559" text-anchor="middle" class="small">幸存者</text><rect x="280" y="505" width="150" height="70" rx="14" fill="#fff" stroke="#bfe5d4"/><text x="355" y="536" text-anchor="middle" class="body">S1</text><text x="355" y="559" text-anchor="middle" class="small">交替复制</text><path d="M250 540 H280" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="620" class="small">存活对象年龄 +1；达到阈值 → 晋升</text><text x="100" y="650" class="mono">Eden + S0 + S1 ≈ 8 : 1 : 1</text>
  <rect x="505" y="270" width="390" height="400" rx="22" fill="#fff1e0" stroke="#efca8b" stroke-width="2" filter="url(#shadow)"/><text x="535" y="316" class="h">② 标记—清除</text><text x="535" y="350" class="small">适合老年代：空间利用率高，但会碎片化</text><rect x="535" y="385" width="330" height="74" rx="14" fill="#fff" stroke="#f0d59e"/><text x="560" y="415" class="body">Mark 标记</text><text x="560" y="442" class="small">遍历 Roots，给可达对象打标记</text><path d="M700 463 V500" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="512" width="330" height="74" rx="14" fill="#fff" stroke="#f0d59e"/><text x="560" y="542" class="body">Sweep 清除</text><text x="560" y="569" class="small">回收未标记对象，留下空洞</text><path d="M700 590 V620" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/><text x="535" y="652" class="small">优点：无需移动存活对象  ·  缺点：内存碎片</text>
  <rect x="940" y="270" width="390" height="400" rx="22" fill="#e7efff" stroke="#b5ccef" stroke-width="2" filter="url(#shadow)"/><text x="970" y="316" class="h">③ 老年代回收</text><text x="970" y="350" class="small">Major / Full GC：低频、停顿更长</text><rect x="970" y="385" width="330" height="74" rx="14" fill="#fff" stroke="#c7d7f1"/><text x="995" y="415" class="body">标记—整理</text><text x="995" y="442" class="small">标记存活 → 向一端压缩 → 清理边界</text><path d="M1135 463 V500" stroke="#54708f" stroke-width="3" marker-end="url(#arrow)"/><rect x="970" y="512" width="330" height="74" rx="14" fill="#fff" stroke="#c7d7f1"/><text x="995" y="542" class="body">回收触发</text><text x="995" y="569" class="small">老年代满 / 分配担保失败</text><rect x="970" y="610" width="330" height="40" rx="12" fill="#d8e5ff"/><text x="1135" y="636" text-anchor="middle" class="small">STW：暂停业务线程，完成关键阶段</text>
  <rect x="70" y="710" width="1260" height="60" rx="16" fill="#253c52"/><text x="100" y="738" fill="#fff" font-size="16" font-family="Microsoft YaHei">算法速记：复制适合存活率低的新生代；标记-清除会碎片；标记-整理减少碎片但移动对象成本更高。</text><text x="100" y="761" fill="#b9cad9" font-size="14" font-family="Microsoft YaHei">调优目标：降低 STW 频率与停顿时间，而不是让 GC 完全消失。</text>
</svg>