<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">Profiler：算子融合前后 Kernel 时间线</text><text x="750" y="82" text-anchor="middle" font-size="21" fill="#475569">融合的收益来自减少 launch 次数与 HBM 中间张量读写，不是改变数学结果</text><text x="90" y="175" font-size="24" font-weight="bold">融合前</text><line x1="230" y1="165" x2="1390" y2="165" stroke="#64748b" stroke-width="3"/><g><rect x="250" y="210" width="180" height="75" fill="#fecaca"/><rect x="470" y="210" width="180" height="75" fill="#fed7aa"/><rect x="690" y="210" width="180" height="75" fill="#fde68a"/><rect x="910" y="210" width="180" height="75" fill="#fecaca"/></g><g font-size="20" text-anchor="middle"><text x="340" y="255">add</text><text x="560" y="255">bias</text><text x="780" y="255">relu</text><text x="1000" y="255">mul</text></g><text x="1200" y="250" font-size="21" fill="#991b1b">4 launches</text><text x="250" y="335" font-size="20" fill="#991b1b">每个中间结果写入 HBM，再被下一 kernel 读回</text><text x="250" y="370" font-size="20" fill="#991b1b">HBM traffic ≈ 4 次读 + 4 次写 + 输入输出</text><text x="90" y="475" font-size="24" font-weight="bold">融合后</text><line x1="230" y1="465" x2="1390" y2="465" stroke="#64748b" stroke-width="3"/><rect x="250" y="510" width="620" height="85" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><text x="560" y="562" text-anchor="middle" font-size="24">fused_add_bias_relu_mul</text><text x="1000" y="555" font-size="21" fill="#166534">1 launch</text><text x="250" y="645" font-size="20" fill="#166534">中间值保留在寄存器/片上缓存，最后一次写回</text><text x="250" y="680" font-size="20" fill="#166534">理论加速上限：T≈T_launch·(4−1)+节省的 HBM traffic / BW</text><text x="750" y="755" text-anchor="middle" font-size="22" fill="#334155">验证方法：记录 kernel 数、self time、显存读写字节和峰值临时张量；仅看 wall time 不足以证明融合</text></g></svg>