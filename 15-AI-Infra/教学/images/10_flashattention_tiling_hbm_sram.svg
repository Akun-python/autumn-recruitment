<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">FlashAttention：分块 + 在线 Softmax，减少 HBM 往返</text><text x="750" y="82" text-anchor="middle" font-size="21" fill="#475569">标准注意力物化 S=QKᵀ 和 P=softmax(S)；FlashAttention 只在 SRAM 中处理 tile</text><rect x="70" y="140" width="570" height="610" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/><text x="355" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#991b1b">标准 Attention</text><rect x="125" y="250" width="200" height="120" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="225" y="300" text-anchor="middle" font-size="25">HBM: Q,K,V</text><text x="225" y="340" text-anchor="middle" font-size="18">反复读入 GPU 显存</text><rect x="390" y="250" width="190" height="120" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><text x="485" y="300" text-anchor="middle" font-size="24">S=QKᵀ</text><text x="485" y="340" text-anchor="middle" font-size="18">写回 HBM</text><rect x="260" y="460" width="230" height="120" fill="#f87171" stroke="#b91c1c" stroke-width="3"/><text x="375" y="510" text-anchor="middle" font-size="24">P=softmax(S)</text><text x="375" y="550" text-anchor="middle" font-size="18">再读写 HBM</text><path d="M325 310 L390 310" stroke="#b91c1c" stroke-width="5" marker-end="url(#a)"/><path d="M485 370 C485 420 430 450 430 460" fill="none" stroke="#b91c1c" stroke-width="5" marker-end="url(#a)"/><text x="355" y="665" text-anchor="middle" font-size="22" fill="#7f1d1d">主要瓶颈：中间矩阵 O(N²) 的 HBM 读写</text><text x="355" y="705" text-anchor="middle" font-size="21" fill="#7f1d1d">IO 量约随 N² 增长</text><rect x="730" y="140" width="700" height="610" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="1080" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#166534">FlashAttention</text><rect x="780" y="245" width="260" height="135" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><text x="910" y="290" text-anchor="middle" font-size="24">HBM</text><text x="910" y="330" text-anchor="middle" font-size="19">Q/K/V 分块加载</text><text x="910" y="360" text-anchor="middle" font-size="18">每块只读一次或少次</text><rect x="1120" y="245" width="240" height="135" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="1240" y="290" text-anchor="middle" font-size="24">SRAM/Shared</text><text x="1240" y="330" text-anchor="middle" font-size="19">Qᵢ、Kⱼ、Vⱼ tile</text><text x="1240" y="360" text-anchor="middle" font-size="18">片上高速复用</text><path d="M1040 312 L1120 312" stroke="#15803d" stroke-width="5" marker-end="url(#b)"/><rect x="885" y="485" width="390" height="130" fill="#4ade80" stroke="#15803d" stroke-width="3"/><text x="1080" y="530" text-anchor="middle" font-size="23">在线 Softmax 状态</text><text x="1080" y="568" text-anchor="middle" font-size="19">mᵢₙₑw=max(m, mⱼ)</text><text x="1080" y="595" text-anchor="middle" font-size="19">ℓᵢₙₑw=eᵐ⁻ᵐⁿᵉʷℓ+Σeˢ⁻ᵐⁿᵉʷ</text><path d="M1240 380 C1240 440 1180 465 1180 485" fill="none" stroke="#15803d" stroke-width="5" marker-end="url(#b)"/><text x="1080" y="675" text-anchor="middle" font-size="22" fill="#166534">不物化 N×N 矩阵，输出块直接写回</text><text x="1080" y="712" text-anchor="middle" font-size="21" fill="#166534">降低 HBM traffic，算子融合减少 kernel launch</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#b91c1c"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15803d"/></marker></defs></g></svg>