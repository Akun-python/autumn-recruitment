<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">预测式专家预取：把 stall 换成可重叠的后台 DMA</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">MoE 逐层执行：第 l-1 层算完才有信息去猜第 l 层要哪些专家</text>

  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d97706" stroke-width="2" opacity="0.55"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d97706"/>
    </marker>
  </defs>

  <g font-size="12" fill="#334155">
    <text x="14" y="104">① Router</text>
    <text x="14" y="119" font-size="10" fill="#64748b">输出 top-k</text>
    <text x="14" y="176">② 预测器</text>
    <text x="14" y="191" font-size="10" fill="#64748b">上层/马尔可夫/logistic</text>
    <text x="14" y="248">③ 后台 DMA</text>
    <text x="14" y="263" font-size="10" fill="#64748b">与计算重叠搬运</text>
    <text x="14" y="328">④ 计算</text>
    <text x="14" y="343" font-size="10" fill="#64748b">命中即算 / 未命中等</text>
  </g>

  <g opacity="0.55">
    <rect x="132" y="84" width="778" height="46" rx="6" fill="#e2e8f0"/>
    <rect x="132" y="154" width="778" height="46" rx="6" fill="#e2e8f0"/>
    <rect x="132" y="226" width="778" height="46" rx="6" fill="#e2e8f0"/>
    <rect x="132" y="302" width="778" height="56" rx="6" fill="#e2e8f0"/>
  </g>

  <line x1="132" y1="388" x2="912" y2="388" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <line x1="160" y1="388" x2="160" y2="394" stroke="#94a3b8"/><text x="160" y="406">t0</text>
    <line x1="300" y1="388" x2="300" y2="394" stroke="#94a3b8"/><text x="300" y="406">t1</text>
    <line x1="440" y1="388" x2="440" y2="394" stroke="#94a3b8"/><text x="440" y="406">t2</text>
    <line x1="630" y1="388" x2="630" y2="394" stroke="#94a3b8"/><text x="630" y="406">t3</text>
    <line x1="800" y1="388" x2="800" y2="394" stroke="#94a3b8"/><text x="800" y="406">t4</text>
  </g>
  <text x="915" y="406" font-size="10" fill="#64748b" text-anchor="end">时间 →</text>

  <rect x="160" y="92" width="132" height="30" rx="5" fill="#1d4ed8" opacity="0.92"/>
  <text x="226" y="111" text-anchor="middle" font-size="11" fill="#ffffff">第 l-1 层：{3, 11}</text>

  <rect x="630" y="92" width="150" height="30" rx="5" fill="#1d4ed8" opacity="0.92"/>
  <text x="705" y="111" text-anchor="middle" font-size="11" fill="#ffffff">第 l 层：{3, 11, 15}</text>

  <rect x="300" y="162" width="164" height="30" rx="5" fill="#7c3aed" opacity="0.92"/>
  <text x="382" y="181" text-anchor="middle" font-size="11" fill="#ffffff">预测第 l 层：{3,7,11,15}</text>
  <text x="382" y="216" text-anchor="middle" font-size="10" fill="#6d28d9">只用 l-1 层信息（因果边界）</text>

  <rect x="440" y="234" width="252" height="30" rx="5" fill="#0d9488" opacity="0.92"/>
  <text x="566" y="253" text-anchor="middle" font-size="11" fill="#ffffff">DMA 搬 4 个专家 × 8MB ≈ 667 µs</text>
  <text x="500" y="292" text-anchor="middle" font-size="10" fill="#0f766e">与上一层计算并行，85% 被重叠掩盖</text>

  <rect x="630" y="310" width="94" height="40" rx="4" fill="#16a34a" opacity="0.94"/>
  <text x="677" y="328" text-anchor="middle" font-size="11" fill="#ffffff">命中 {3,11}</text>
  <text x="677" y="343" text-anchor="middle" font-size="10" fill="#dcfce7">直接算，无 stall</text>

  <rect x="732" y="310" width="86" height="40" rx="4" fill="#dc2626" opacity="0.94"/>
  <text x="775" y="328" text-anchor="middle" font-size="11" fill="#ffffff">缺 {15}</text>
  <text x="775" y="343" text-anchor="middle" font-size="10" fill="#fee2e2">等 160 µs</text>

  <rect x="826" y="234" width="84" height="30" rx="5" fill="#f59e0b" opacity="0.28"/>
  <rect x="826" y="234" width="84" height="30" rx="5" fill="url(#hatch)" stroke="#d97706" stroke-width="1.5"/>
  <text x="868" y="253" text-anchor="middle" font-size="11" fill="#92400e">浪费 {7}</text>
  <text x="868" y="287" text-anchor="middle" font-size="10" fill="#b45309">占带宽 / 挤缓存</text>

  <path d="M292 107 L414 107 L414 158" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M382 192 L382 224 L436 224 L436 232" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M705 234 L705 306" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M705 122 L705 156" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="713" y="148" font-size="10" fill="#64748b">真实需求（闭环对照）</text>
  <path d="M868 264 L868 296 L782 296 L782 306" fill="none" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrA)"/>

  <rect x="132" y="418" width="778" height="44" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="146" y="437" font-size="12" font-weight="bold" fill="#9a3412">关键权衡</text>
  <text x="146" y="453" font-size="11" fill="#7c2d12">命中省 160 µs stall；猜错白搬 8MB 并挤掉热专家。净收益 = 命中×160 µs − 预取×25 µs（暴露部分）</text>

  <g font-size="11" fill="#334155">
    <rect x="132" y="478" width="13" height="10" fill="#1d4ed8"/><text x="151" y="487">Router 输出</text>
    <rect x="246" y="478" width="13" height="10" fill="#7c3aed"/><text x="265" y="487">预测</text>
    <rect x="318" y="478" width="13" height="10" fill="#0d9488"/><text x="337" y="487">后台 DMA（重叠）</text>
    <rect x="452" y="478" width="13" height="10" fill="#16a34a"/><text x="471" y="487">命中（无 stall）</text>
    <rect x="586" y="478" width="13" height="10" fill="#dc2626"/><text x="605" y="487">未命中（stall）</text>
    <rect x="712" y="478" width="13" height="10" fill="#f59e0b" opacity="0.55" stroke="#d97706"/><text x="731" y="487">预取了但没用（浪费）</text>
  </g>
  <text x="480" y="518" text-anchor="middle" font-size="10" fill="#64748b">提前 k 层预测：k 越大 → 命中率越低、浪费率越高；工程上通常只提前 1~2 层</text>
</svg>

