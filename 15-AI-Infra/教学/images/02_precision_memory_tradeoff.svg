<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">精度、显存与数值稳定性：从 FP32 到 INT4</text><text x="750" y="82" text-anchor="middle" font-size="20" fill="#475569">显存估算按每个参数的字节数；精度降低不等于误差自动消失</text><line x1="150" y1="680" x2="1370" y2="680" stroke="#334155" stroke-width="3"/><line x1="150" y1="150" x2="150" y2="680" stroke="#334155" stroke-width="3"/><text x="760" y="755" text-anchor="middle" font-size="23">表示精度 ↓ / 单参数显存 ↓</text><text x="65" y="420" transform="rotate(-90 65 420)" text-anchor="middle" font-size="23">相对显存（以 FP32=1）</text><g fill="#60a5fa"><rect x="230" y="220" width="150" height="460"/><rect x="500" y="450" width="150" height="230"/><rect x="770" y="450" width="150" height="230"/><rect x="1040" y="565" width="150" height="115"/></g><g font-size="24" text-anchor="middle"><text x="305" y="205">FP32</text><text x="575" y="435">BF16</text><text x="845" y="435">FP16</text><text x="1115" y="550">INT4</text><text x="305" y="285">4 B/param</text><text x="575" y="515">2 B/param</text><text x="845" y="515">2 B/param</text><text x="1115" y="615">0.5 B/param</text></g><path d="M260 180 C500 250 700 300 900 390 S1200 450 1300 500" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8"/><text x="1130" y="360" font-size="21" fill="#991b1b">量化误差/校准敏感性</text><text x="760" y="150" text-anchor="middle" font-size="22" fill="#475569">BF16 保留 8 位指数，动态范围大；FP16 保留 10 位尾数，精度更细但易溢出/下溢；INT4 依赖 scale、zero-point 和校准数据</text><text x="760" y="800" text-anchor="middle" font-size="20" fill="#64748b">训练：通常保留 FP32 master/optimizer；推理：权重低比特，但 KV Cache 与激活仍需单独核算</text></g></svg>