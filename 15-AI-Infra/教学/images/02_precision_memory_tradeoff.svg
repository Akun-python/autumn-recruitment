<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010"><rect width="1500" height="1010" fill="#f8fafc"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,Arial,sans-serif"><text x="750" y="46" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">精度、显存与数值稳定性：从 FP32 到 INT4</text><text x="750" y="84" text-anchor="middle" font-size="20" fill="#475569">柱高 = 单参数显存（FP32=1）；精度降低 ≠ 误差自动消失 —— 实际误差由动态范围、离群值与校准质量决定</text><line x1="160" y1="680" x2="1450" y2="680" stroke="#334155" stroke-width="3"/><line x1="160" y1="150" x2="160" y2="680" stroke="#334155" stroke-width="3"/><text x="52" y="420" transform="rotate(-90 52 420)" text-anchor="middle" font-size="20" fill="#475569">相对显存（FP32=1）</text><rect x="165" y="260" width="130" height="420" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/><text x="230" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">1.0</text><text x="230" y="476" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4 B/param</text><rect x="395" y="470" width="130" height="210" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/><text x="460" y="450" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d4ed8">0.5</text><text x="460" y="581" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2 B/param</text><rect x="625" y="470" width="130" height="210" fill="#5eead4" stroke="#0d9488" stroke-width="2"/><text x="690" y="450" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f766e">0.5</text><text x="690" y="581" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2 B/param</text><rect x="855" y="575" width="130" height="105" fill="#fde047" stroke="#ca8a04" stroke-width="2"/><text x="920" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="#a16207">0.25</text><text x="920" y="633" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1 B/param</text><rect x="1085" y="575" width="130" height="105" fill="#fdba74" stroke="#c2410c" stroke-width="2"/><text x="1150" y="555" text-anchor="middle" font-size="20" font-weight="bold" fill="#9a3412">0.25</text><text x="1150" y="633" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1 B/param</text><rect x="1315" y="627" width="130" height="53" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/><text x="1380" y="607" text-anchor="middle" font-size="20" font-weight="bold" fill="#b91c1c">0.125</text><text x="1380" y="660" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">0.5B</text><g font-size="20" text-anchor="middle" font-weight="bold" fill="#0f172a"><text x="230" y="706">FP32</text><text x="460" y="706">BF16</text><text x="690" y="706">FP16</text><text x="920" y="706">FP8 E4M3</text><text x="1150" y="706">INT8</text><text x="1380" y="706">INT4</text></g><g font-size="14" text-anchor="middle" fill="#475569"><text x="230" y="732">指数 8 · 尾数 23</text><text x="460" y="732">指数 8 · 尾数 7</text><text x="690" y="732">指数 5 · 尾数 10</text><text x="920" y="732">指数 4 · 尾数 3</text><text x="1150" y="732">整型 ±127</text><text x="1380" y="732">整型 −8 ~ 7</text><text x="230" y="756">±3.4×10³⁸</text><text x="460" y="756">±3.4×10³⁸</text><text x="690" y="756">6×10⁻⁵~6.5×10⁴</text><text x="920" y="756">峰值 ±448</text><text x="1150" y="756">无小数</text><text x="1380" y="756">无小数</text><text x="230" y="780" fill="#64748b">训练基准 / master</text><text x="460" y="780" fill="#64748b">训练前向 · 大动态</text><text x="690" y="780" fill="#64748b">训练 · 需 loss scaling</text><text x="920" y="780" fill="#64748b">前向 / 激活（H100）</text><text x="1150" y="780" fill="#64748b">推理权重 / 激活</text><text x="1380" y="780" fill="#64748b">推理权重（量化后）</text></g><path d="M165 195 C 400 240, 620 300, 900 400 S 1250 520, 1445 590" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="12 8"/><text x="1030" y="230" font-size="20" font-weight="bold" fill="#b91c1c">量化误差 / 校准敏感性 ↑</text><rect x="160" y="815" width="620" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="470" y="848" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e40af">🧑‍🏫 训练场景</text><text x="470" y="884" text-anchor="middle" font-size="16" fill="#1e3a8a">权重/梯度常用 BF16 或 FP16，另存 FP32 master + optimizer；</text><text x="470" y="912" text-anchor="middle" font-size="16" fill="#1e3a8a">FP16 需 loss scaling 防溢出/下溢；FP8 逐步用于前向与激活。</text><rect x="830" y="815" width="620" height="120" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="1140" y="848" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">⚡ 推理场景</text><text x="1140" y="884" text-anchor="middle" font-size="16" fill="#14532d">权重可压 INT8/INT4（GPTQ/AWQ/SmoothQuant），KV Cache 与激活单独核算；</text><text x="1140" y="912" text-anchor="middle" font-size="16" fill="#14532d">显存收益显著，但需用校准集验证量化误差是否可接受。</text><text x="750" y="975" text-anchor="middle" font-size="17" fill="#64748b">典型参考：FP32 存 7B 参数 ≈ 28 GB；BF16 ≈ 14 GB；INT4 ≈ 3.5 GB（另加 KV Cache 与激活内存）</text></g></svg>