<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><rect width="1500" height="850" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="46" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">CUDA 执行层级：Grid → Block → Warp → Thread</text><text x="750" y="82" text-anchor="middle" font-size="20" fill="#475569">一个 thread 负责一个输出元素；block 负责一个 tile；grid 覆盖完整矩阵</text><rect x="90" y="135" width="1320" height="610" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="750" y="180" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e3a8a">Grid：整个 GEMM 的所有 thread blocks</text><g stroke="#2563eb" stroke-width="3" fill="#bfdbfe"><rect x="150" y="230" width="330" height="230" rx="12"/><rect x="585" y="230" width="330" height="230" rx="12"/><rect x="1020" y="230" width="330" height="230" rx="12"/></g><g font-size="25" text-anchor="middle" fill="#1e3a8a"><text x="315" y="270">Block (0,0)</text><text x="750" y="270">Block (1,0)</text><text x="1185" y="270">Block (2,0)</text></g><g stroke="#16a34a" stroke-width="2" fill="#bbf7d0"><rect x="180" y="315" width="120" height="90"/><rect x="320" y="315" width="120" height="90"/><rect x="615" y="315" width="120" height="90"/><rect x="755" y="315" width="120" height="90"/><rect x="1050" y="315" width="120" height="90"/><rect x="1190" y="315" width="120" height="90"/></g><g font-size="19" text-anchor="middle" fill="#166534"><text x="240" y="350">Warp 0</text><text x="240" y="380">32 threads</text><text x="380" y="350">Warp 1</text><text x="380" y="380">32 threads</text><text x="675" y="350">Warp 0</text><text x="675" y="380">32 threads</text><text x="815" y="350">Warp 1</text><text x="815" y="380">32 threads</text><text x="1110" y="350">Warp 0</text><text x="1110" y="380">32 threads</text><text x="1250" y="350">Warp 1</text><text x="1250" y="380">32 threads</text></g><g fill="#fef3c7" stroke="#d97706" stroke-width="2"><rect x="180" y="520" width="120" height="90"/><rect x="320" y="520" width="120" height="90"/><rect x="615" y="520" width="120" height="90"/><rect x="755" y="520" width="120" height="90"/><rect x="1050" y="520" width="120" height="90"/><rect x="1190" y="520" width="120" height="90"/></g><g font-size="18" text-anchor="middle" fill="#92400e"><text x="240" y="555">T(ty,tx)</text><text x="240" y="585">C[row,col]</text><text x="380" y="555">T(ty,tx+1)</text><text x="380" y="585">C[row,col+1]</text><text x="675" y="555">tile 1</text><text x="675" y="585">coalesced load</text><text x="815" y="555">tile 1</text><text x="815" y="585">shared memory</text><text x="1110" y="555">tile 2</text><text x="1110" y="585">register accum</text><text x="1250" y="555">tile 2</text><text x="1250" y="585">write C</text></g><text x="750" y="700" text-anchor="middle" font-size="22" fill="#334155">索引：row = blockIdx.y·blockDim.y + threadIdx.y；col = blockIdx.x·blockDim.x + threadIdx.x</text><text x="750" y="735" text-anchor="middle" font-size="22" fill="#334155">并行映射：C[row,col] = Σₖ A[row,k]·B[k,col]，tile 在 shared memory 复用</text></g></svg>