<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><rect width="1500" height="850" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">SmoothQuant：把激活离群值迁移到权重</text><text x="750" y="82" text-anchor="middle" font-size="21" fill="#475569">约定 X′=X·diag(s)⁻¹，W′=diag(s)·W，使 XW = X′W′</text><text x="95" y="180" font-size="25" font-weight="bold">迁移前</text><rect x="80" y="220" width="250" height="220" fill="#fecaca" stroke="#dc2626" stroke-width="3"/><text x="205" y="270" text-anchor="middle" font-size="26">激活 X</text><rect x="125" y="320" width="45" height="80" fill="#f87171"/><rect x="185" y="350" width="45" height="50" fill="#fca5a5"/><rect x="245" y="370" width="45" height="30" fill="#fca5a5"/><text x="205" y="470" text-anchor="middle" font-size="20" fill="#991b1b">某通道有尖峰 max|Xⱼ|</text><rect x="400" y="220" width="250" height="220" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="525" y="270" text-anchor="middle" font-size="26">权重 W</text><rect x="445" y="340" width="45" height="60" fill="#fca5a5"/><rect x="505" y="340" width="45" height="60" fill="#fca5a5"/><rect x="565" y="340" width="45" height="60" fill="#fca5a5"/><text x="525" y="470" text-anchor="middle" font-size="20">量化难度由激活尖峰决定</text><path d="M680 330 L820 330" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><text x="750" y="285" text-anchor="middle" font-size="22" fill="#1d4ed8">选择 sⱼ = max|Xⱼ|^α / max|Wⱼ|^(1−α)</text><text x="750" y="380" text-anchor="middle" font-size="21" fill="#1d4ed8">离群值从 X 迁移到 W</text><text x="850" y="180" font-size="25" font-weight="bold">迁移后</text><rect x="830" y="220" width="250" height="220" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="955" y="270" text-anchor="middle" font-size="26">X′=X·diag(s)⁻¹</text><rect x="875" y="365" width="45" height="35" fill="#86efac"/><rect x="935" y="375" width="45" height="25" fill="#bbf7d0"/><rect x="995" y="382" width="45" height="18" fill="#bbf7d0"/><text x="955" y="470" text-anchor="middle" font-size="20" fill="#166534">激活分布更平滑</text><rect x="1150" y="220" width="250" height="220" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1275" y="270" text-anchor="middle" font-size="26">W′=diag(s)·W</text><rect x="1195" y="310" width="45" height="90" fill="#60a5fa"/><rect x="1255" y="340" width="45" height="60" fill="#93c5fd"/><rect x="1315" y="355" width="45" height="45" fill="#bfdbfe"/><text x="1275" y="470" text-anchor="middle" font-size="20" fill="#1e3a8a">权重承担尺度变化</text><text x="750" y="610" text-anchor="middle" font-size="27" fill="#0f172a">数学等价：XW = (X·S⁻¹)(S·W) = X′W′</text><text x="750" y="665" text-anchor="middle" font-size="22" fill="#475569">目标：让 INT8 量化时激活与权重都更接近可表示范围，降低离群值导致的误差</text><text x="750" y="715" text-anchor="middle" font-size="21" fill="#64748b">注意：s 的统计轴必须与输入通道一致；W 的对应行/列取决于矩阵布局约定</text><defs><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#2563eb"/></marker></defs></g></svg>