<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010"><rect width="1500" height="1010" fill="#f8fafc"/><g font-family="Microsoft YaHei,PingFang SC,Noto Sans SC,Arial,sans-serif"><text x="750" y="46" text-anchor="middle" font-size="34" font-weight="bold" fill="#0f172a">SmoothQuant：把激活离群值迁移到权重</text><text x="750" y="84" text-anchor="middle" font-size="20" fill="#475569">数学等价 XW = X′W′（X′=X·S⁻¹，W′=S·W）—— 代价从“激活量化难”转移到“权重承担尺度”</text><rect x="60" y="130" width="420" height="570" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/><text x="270" y="162" text-anchor="middle" font-size="22" font-weight="bold" fill="#9a3412">迁移前</text><text x="270" y="190" text-anchor="middle" font-size="16" fill="#9a3412">激活有离群尖峰 → 激活量化误差大</text><rect x="80" y="220" width="380" height="230" rx="8" fill="#ffffff" stroke="#f87171" stroke-width="2"/><text x="270" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">激活 X（per-channel）</text><rect x="115" y="400" width="70" height="5" fill="#ef4444"/><text x="150" y="392" text-anchor="middle" font-size="14" fill="#7f1d1d">0.1</text><rect x="235" y="396" width="70" height="9" fill="#ef4444"/><text x="270" y="388" text-anchor="middle" font-size="14" fill="#7f1d1d">0.2</text><rect x="355" y="210" width="70" height="195" fill="#ef4444"/><text x="390" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">100</text><text x="270" y="438" text-anchor="middle" font-size="15" fill="#b91c1c">max|X| = 100（某个通道尖峰）</text><rect x="80" y="470" width="380" height="140" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><text x="270" y="500" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d4ed8">权重 W</text><rect x="115" y="540" width="70" height="32" fill="#93c5fd"/><rect x="235" y="540" width="70" height="32" fill="#93c5fd"/><rect x="355" y="540" width="70" height="32" fill="#93c5fd"/><text x="270" y="596" text-anchor="middle" font-size="15" fill="#1d4ed8">max|W| = 1（均匀小值）</text><text x="270" y="672" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">INT8 步长 = 200/254 ≈ 0.79 → 小值量化后失真大</text><rect x="540" y="130" width="420" height="570" rx="12" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2.5"/><text x="750" y="162" text-anchor="middle" font-size="22" font-weight="bold" fill="#075985">迁移机制</text><text x="750" y="190" text-anchor="middle" font-size="16" fill="#075985">按通道计算缩放系数 s</text><rect x="560" y="215" width="380" height="120" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/><text x="750" y="255" text-anchor="middle" font-size="21" font-weight="bold" fill="#0c4a6e">sⱼ = max|Xⱼ|^α / max|Wⱼ|^(1−α)</text><text x="750" y="295" text-anchor="middle" font-size="16" fill="#075985">常用 α=0.5 均衡 · α=0 不迁移 · α=1 全迁到权重</text><rect x="560" y="355" width="380" height="260" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/><text x="750" y="388" text-anchor="middle" font-size="18" font-weight="bold" fill="#075985">数值例子（α = 0.5）</text><text x="620" y="430" font-size="17" fill="#0f172a">X = [0.1, 0.2, 100]</text><text x="620" y="464" font-size="17" fill="#0f172a">W = [1, 1, 1]</text><text x="620" y="498" font-size="17" fill="#0f172a">s = √100 / √1 = 10</text><text x="620" y="532" font-size="17" fill="#0f172a">X′ = X/s = [0.01, 0.02, 10]</text><text x="620" y="566" font-size="17" fill="#0f172a">W′ = W·s = [10, 10, 10]</text><text x="620" y="600" font-size="16" font-weight="bold" fill="#15803d">验证：XW = X′W′ ✓（逐元素相等）</text><rect x="1020" y="130" width="420" height="570" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="2.5"/><text x="1230" y="162" text-anchor="middle" font-size="22" font-weight="bold" fill="#166534">迁移后</text><text x="1230" y="190" text-anchor="middle" font-size="16" fill="#166534">激活平滑、权重承担尺度 → 双双友好</text><rect x="1040" y="220" width="380" height="230" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="2"/><text x="1230" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">X′ = X/s</text><rect x="1075" y="401" width="70" height="4" fill="#22c55e"/><text x="1110" y="393" text-anchor="middle" font-size="14" fill="#14532d">0.01</text><rect x="1195" y="398" width="70" height="7" fill="#22c55e"/><text x="1230" y="390" text-anchor="middle" font-size="14" fill="#14532d">0.02</text><rect x="1315" y="210" width="70" height="195" fill="#22c55e"/><text x="1350" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">10</text><text x="1230" y="438" text-anchor="middle" font-size="15" fill="#166534">max|X′| = 10（下降 10×）</text><rect x="1040" y="470" width="380" height="140" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><text x="1230" y="500" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">W′ = W·s</text><rect x="1075" y="540" width="70" height="32" fill="#60a5fa"/><rect x="1195" y="540" width="70" height="32" fill="#60a5fa"/><rect x="1315" y="540" width="70" height="32" fill="#60a5fa"/><text x="1230" y="596" text-anchor="middle" font-size="15" fill="#1e40af">max|W′| = 10（与激活平衡）</text><text x="1230" y="672" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">INT8 步长 = 20/254 ≈ 0.079 → 小值误差 ↓10×</text><defs><marker id="ar" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#2563eb"/></marker></defs><path d="M488 360 L532 360" stroke="#2563eb" stroke-width="5" marker-end="url(#ar)"/><text x="510" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">算 s</text><path d="M968 360 L1012 360" stroke="#2563eb" stroke-width="5" marker-end="url(#ar)"/><text x="990" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">迁移</text><text x="750" y="730" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">INT8 量化误差对比（同一组激活值）</text><rect x="90" y="752" width="640" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/><text x="410" y="788" text-anchor="middle" font-size="18" font-weight="bold" fill="#b91c1c">迁移前</text><text x="410" y="820" text-anchor="middle" font-size="15" fill="#7f1d1d">激活范围 ±100 → 步长 ≈ 0.79：小值被抹平、尖峰饱和，相对误差大</text><rect x="770" y="752" width="640" height="96" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="1090" y="788" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">迁移后</text><text x="1090" y="820" text-anchor="middle" font-size="15" fill="#14532d">激活范围 ±10 → 步长 ≈ 0.079：整体量化误差约 ↓10×，两端更均衡</text><text x="750" y="900" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">XW = (X·S⁻¹)(S·W) = X′W′ —— 数学完全等价</text><text x="750" y="940" text-anchor="middle" font-size="16" fill="#64748b">工程注意：s 按输入通道（per-channel）统计，X 的列 ↔ W 的行需对应矩阵布局；用校准集估计 max；</text><text x="750" y="968" text-anchor="middle" font-size="16" fill="#64748b">常与 per-channel 权重量化、GPTQ/AWQ 配合使用（SmoothQuant 治激活离群，GPTQ 治权重重建）。</text></g></svg>