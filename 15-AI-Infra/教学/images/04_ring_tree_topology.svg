<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">Ring 与 Tree：集合通信的拓扑与时间模型</text><text x="750" y="82" text-anchor="middle" font-size="21" fill="#475569">Ring 偏带宽，Tree 偏延迟；真实 NCCL 会按 NVLink/PCIe/RDMA 拓扑选择路径</text><text x="380" y="145" text-anchor="middle" font-size="27" font-weight="bold" fill="#166534">Ring AllReduce</text><circle cx="380" cy="380" r="180" fill="none" stroke="#16a34a" stroke-width="6"/><g fill="#bbf7d0" stroke="#15803d" stroke-width="3"><circle cx="380" cy="190" r="42"/><circle cx="570" cy="380" r="42"/><circle cx="380" cy="570" r="42"/><circle cx="190" cy="380" r="42"/></g><g font-size="22" text-anchor="middle"><text x="380" y="198">R0</text><text x="570" y="388">R1</text><text x="380" y="578">R2</text><text x="190" y="388">R3</text></g><path d="M420 205 C500 220 550 280 565 340" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M555 420 C530 500 470 550 420 565" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M340 555 C260 530 210 470 195 420" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><path d="M205 340 C230 260 290 210 340 195" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><text x="380" y="680" text-anchor="middle" font-size="21" fill="#166534">2(P−1) 轮；每卡发送/接收约 (P−1)S/P</text><text x="380" y="715" text-anchor="middle" font-size="20" fill="#475569">T≈2(P−1)α + 2(P−1)S/(Pβ)</text><text x="1120" y="145" text-anchor="middle" font-size="27" font-weight="bold" fill="#9a3412">Tree Reduce + Broadcast</text><g fill="#fed7aa" stroke="#c2410c" stroke-width="3"><circle cx="1120" cy="205" r="42"/><circle cx="920" cy="380" r="42"/><circle cx="1120" cy="380" r="42"/><circle cx="1320" cy="380" r="42"/><circle cx="1020" cy="570" r="42"/><circle cx="1220" cy="570" r="42"/></g><g font-size="22" text-anchor="middle"><text x="1120" y="213">root</text><text x="920" y="388">R1</text><text x="1120" y="388">R2</text><text x="1320" y="388">R3</text><text x="1020" y="578">leaf</text><text x="1220" y="578">leaf</text></g><path d="M1120 247 L920 338 M1120 247 L1320 338 M920 422 L1020 528 M1120 422 L1220 528" stroke="#ea580c" stroke-width="5" marker-end="url(#b)"/><path d="M1020 528 L1120 422 M1220 528 L1120 422 M920 338 L1120 247 M1320 338 L1120 247" stroke="#f59e0b" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#b)"/><text x="1120" y="680" text-anchor="middle" font-size="21" fill="#9a3412">log₂P 层级；延迟项更小，但链路带宽利用依赖拓扑</text><text x="1120" y="715" text-anchor="middle" font-size="20" fill="#475569">T≈2log₂(P)α + 2S·log₂(P)/β（实现相关）</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ea580c"/></marker></defs></g></svg>