<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f8fafc"/>
  <g font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, Arial, sans-serif">

    <text x="480" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#0f172a">专家卸载（Expert Offloading）：Layer i 计算 ‖ Layer i+1 专家搬运</text>
    <text x="480" y="63" text-anchor="middle" font-size="14" fill="#475569">双缓冲 + 双队列：搬运走 PCIe/DMA，计算走 SM，二者并行；暴露出来的那段等待就是 stall</text>

    <!-- ============ 面板 ① GPU 显存双缓冲槽 ============ -->
    <rect x="28" y="84" width="440" height="232" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="248" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">① GPU 显存：双缓冲槽（深度 2）</text>

    <rect x="46" y="122" width="190" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="141" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">槽 A：Layer i 的专家</text>
    <text x="141" y="171" text-anchor="middle" font-size="11.5" fill="#166534">状态：compute（计算中）</text>
    <text x="141" y="188" text-anchor="middle" font-size="11.5" fill="#166534">占用显存 = r · S_exp</text>

    <rect x="258" y="122" width="190" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="353" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">槽 B：Layer i+1 的专家</text>
    <text x="353" y="171" text-anchor="middle" font-size="11.5" fill="#1e3a8a">状态：transfer（搬运中）</text>
    <text x="353" y="188" text-anchor="middle" font-size="11.5" fill="#1e3a8a">DMA 直接写显存，不占 SM</text>

    <path d="M141 200 L141 212" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ga)"/>
    <path d="M353 200 L353 212" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ba)"/>

    <rect x="46" y="214" width="402" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="247" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">② CPU DRAM / NVMe：其余卸载专家</text>
    <text x="247" y="252" text-anchor="middle" font-size="11.5" fill="#92400e">大小 = (1 − r) · P_exp ≈ B − P_dense − 缓冲开销</text>

    <path d="M430 258 L430 300 L300 300" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#oa)"/>
    <text x="222" y="296" text-anchor="middle" font-size="11" fill="#b45309">冷专家留在片外，按路由按需拉取</text>

    <text x="141" y="310" text-anchor="middle" font-size="11" fill="#166534">槽 A 用完即可被 Layer i+2 复用 → 环形双缓冲</text>

    <!-- ============ 面板 ③ 为什么能重叠 ============ -->
    <rect x="484" y="84" width="448" height="232" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="708" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">③ 并行从哪来：两个硬件单元 + 两级流水</text>

    <g font-size="12.5" fill="#334155">
      <text x="502" y="136">• 搬运走 PCIe / NVLink 的 DMA 引擎，计算走 SM，互不占用</text>
      <text x="502" y="162">• 双缓冲：一层在算、一层在传，算完直接换槽，无需等待</text>
      <text x="502" y="188">• 层级流水：Layer i+1 的专家在 Layer i 计算期间就已到位</text>
      <text x="502" y="214">• 前提：得提前知道下一层命中哪些专家（静态预取 / 路由预测）</text>
      <text x="502" y="240">• 代价：多一份缓冲显存；预测错了就漏搬，反而多出 stall</text>
    </g>
    <rect x="502" y="258" width="412" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="708" y="275" text-anchor="middle" font-size="12" fill="#0f172a">有效吞吐上界：tokens/s ≤ BW · (1 − r) / (每 token 命中字节)</text>
    <text x="708" y="292" text-anchor="middle" font-size="11" fill="#475569">即：把「搬不动的字节」变成「常驻的字节」，是卸载的第一性原理</text>

    <!-- ============ 面板 ④ 时序 ============ -->
    <rect x="28" y="330" width="904" height="196" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="44" y="353" font-size="13.5" font-weight="bold" fill="#0f172a">④ 时序：搬运队列 ‖ 计算队列（重叠区 = 被计算吃掉的那部分搬运时间）</text>

    <!-- 行标签 -->
    <text x="118" y="392" text-anchor="end" font-size="11.5" fill="#1e3a8a">PCIe 搬运</text>
    <text x="118" y="434" text-anchor="end" font-size="11.5" fill="#166534">GPU 计算</text>
    <text x="118" y="463" text-anchor="end" font-size="11" fill="#4338ca">重叠区</text>

    <!-- 搬运行：三段首尾相连（链路一直忙） -->
    <g stroke="#2563eb" stroke-width="1.5">
      <rect x="125" y="372" width="205.3" height="24" fill="#bfdbfe"/>
      <rect x="330.3" y="372" width="205.4" height="24" fill="#bfdbfe"/>
      <rect x="535.7" y="372" width="205.3" height="24" fill="#bfdbfe"/>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#1e3a8a">
      <text x="227.7" y="388">Layer 0 搬运</text>
      <text x="433" y="388">Layer 1 搬运</text>
      <text x="638.4" y="388">Layer 2 搬运</text>
    </g>

    <!-- 计算行：向后错开一层，形成重叠 -->
    <g stroke="#16a34a" stroke-width="1.5">
      <rect x="330.3" y="414" width="154" height="24" fill="#bbf7d0"/>
      <rect x="535.7" y="414" width="154" height="24" fill="#bbf7d0"/>
      <rect x="741" y="414" width="154" height="24" fill="#bbf7d0"/>
    </g>
    <g font-size="10.5" text-anchor="middle" fill="#166534">
      <text x="407.3" y="430">Layer 0 计算</text>
      <text x="612.7" y="430">Layer 1 计算</text>
      <text x="818" y="430">Layer 2 计算</text>
    </g>

    <!-- stall：搬运还没到位，GPU 空转 -->
    <g fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3">
      <rect x="484.3" y="414" width="51.4" height="24"/>
      <rect x="689.7" y="414" width="51.3" height="24"/>
    </g>
    <g font-size="9.5" text-anchor="middle" fill="#9a3412">
      <text x="510" y="430">stall</text>
      <text x="715.4" y="430">stall</text>
    </g>

    <!-- 重叠区带 -->
    <g fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="5 3">
      <rect x="330.3" y="452" width="154" height="13"/>
      <rect x="535.7" y="452" width="154" height="13"/>
      <rect x="741" y="452" width="154" height="13"/>
    </g>
    <g font-size="9.5" text-anchor="middle" fill="#3730a3">
      <text x="407.3" y="462">重叠 overlap</text>
      <text x="612.7" y="462">重叠 overlap</text>
    </g>

    <!-- 时间轴 -->
    <path d="M125 468 L912 468" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ta)"
          transform="translate(0,-3)"/>
    <g stroke="#94a3b8" stroke-width="1">
      <path d="M125 462 L125 470"/><path d="M330.3 462 L330.3 470"/><path d="M535.7 462 L535.7 470"/>
      <path d="M741 462 L741 470"/><path d="M895 462 L895 470"/>
    </g>
    <g font-size="9.5" text-anchor="middle" fill="#64748b">
      <text x="125" y="483">0</text>
      <text x="330.3" y="483">60</text>
      <text x="535.7" y="483">120</text>
      <text x="741" y="483">180</text>
      <text x="895" y="483">225</text>
    </g>
    <text x="912" y="483" font-size="9.5" fill="#64748b">t / ms</text>

    <!-- 图例 -->
    <g>
      <rect x="44" y="498" width="18" height="13" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
      <text x="68" y="509" font-size="11" fill="#166534">compute 计算（SM）</text>

      <rect x="212" y="498" width="18" height="13" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="236" y="509" font-size="11" fill="#1e3a8a">transfer 搬运（PCIe DMA）</text>

      <rect x="410" y="498" width="18" height="13" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="434" y="509" font-size="11" fill="#9a3412">stall 空转（没被掩盖的搬运）</text>

      <rect x="628" y="498" width="18" height="13" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.2"/>
      <text x="652" y="509" font-size="11" fill="#3730a3">overlap 重叠区</text>
    </g>
    <text x="912" y="353" text-anchor="end" font-size="10.5" fill="#64748b">示例：每层搬运 60 ms ≫ 计算 45 ms ⇒ 每层暴露 15 ms stall</text>

    <defs>
      <marker id="ga" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/>
      </marker>
      <marker id="ba" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
      </marker>
      <marker id="oa" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#d97706"/>
      </marker>
      <marker id="ta" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
      </marker>
    </defs>
  </g>
</svg>
