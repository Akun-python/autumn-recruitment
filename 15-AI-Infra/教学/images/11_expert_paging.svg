<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f8fafc"/>
  <defs>
    <marker id="arrBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrPurple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <g font-family="Microsoft YaHei, SimHei, sans-serif">
    <text x="480" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">专家分页（Expert Paging）：逻辑页表 → GPU 槽位 → 缺页 PCIe 搬运</text>
    <text x="480" y="58" text-anchor="middle" font-size="12.5" fill="#475569">MoE 每个 token 只激活 top-k 专家：把 (层, 专家) 当作页，按需映射到固定 HBM 槽位，槽位不足时 LRU 淘汰</text>

    <!-- ============ ① 逻辑页表 ============ -->
    <rect x="16" y="76" width="286" height="256" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="159" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">① 逻辑专家页表</text>
    <text x="159" y="114" text-anchor="middle" font-size="10.5" fill="#1d4ed8">page_table[layer][expert] → slot</text>

    <text x="74" y="133" text-anchor="middle" font-size="10" fill="#64748b">E0</text>
    <text x="106" y="133" text-anchor="middle" font-size="10" fill="#64748b">E1</text>
    <text x="138" y="133" text-anchor="middle" font-size="10" fill="#64748b">E2</text>
    <text x="170" y="133" text-anchor="middle" font-size="10" fill="#64748b">E3</text>
    <text x="202" y="133" text-anchor="middle" font-size="10" fill="#64748b">E4</text>
    <text x="234" y="133" text-anchor="middle" font-size="10" fill="#64748b">E5</text>

    <!-- L0 -->
    <text x="56" y="158" text-anchor="end" font-size="11" fill="#334155">L0</text>
    <rect x="58" y="142" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="74" y="158" text-anchor="middle" font-size="10.5" fill="#14532d">S0</text>
    <rect x="90" y="142" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="106" y="158" text-anchor="middle" font-size="10.5" fill="#14532d">S1</text>
    <rect x="122" y="142" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="138" y="158" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="154" y="142" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="170" y="158" text-anchor="middle" font-size="10.5" fill="#14532d">S2</text>
    <rect x="186" y="142" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="202" y="158" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="218" y="142" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="234" y="158" text-anchor="middle" font-size="10.5" fill="#14532d">S7</text>

    <!-- L1 -->
    <text x="56" y="184" text-anchor="end" font-size="11" fill="#334155">L1</text>
    <rect x="58" y="168" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="74" y="184" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="90" y="168" width="32" height="24" rx="3" fill="#fecaca" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="106" y="184" text-anchor="middle" font-size="10.5" fill="#991b1b">S3</text>
    <rect x="122" y="168" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="138" y="184" text-anchor="middle" font-size="10.5" fill="#14532d">S4</text>
    <rect x="154" y="168" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="170" y="184" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="186" y="168" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="202" y="184" text-anchor="middle" font-size="10.5" fill="#14532d">S5</text>
    <rect x="218" y="168" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="234" y="184" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>

    <!-- L2 -->
    <text x="56" y="210" text-anchor="end" font-size="11" fill="#334155">L2</text>
    <rect x="58" y="194" width="32" height="24" rx="3" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="74" y="210" text-anchor="middle" font-size="10.5" fill="#14532d">S6</text>
    <rect x="90" y="194" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="106" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="122" y="194" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="138" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="154" y="194" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="170" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="186" y="194" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="202" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="218" y="194" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="234" y="210" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>

    <!-- L3 -->
    <text x="56" y="236" text-anchor="end" font-size="11" fill="#334155">L3</text>
    <rect x="58" y="220" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="74" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="90" y="220" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="106" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="122" y="220" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="138" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="154" y="220" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="170" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="186" y="220" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="202" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>
    <rect x="218" y="220" width="32" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="234" y="236" text-anchor="middle" font-size="10.5" fill="#64748b">-1</text>

    <text x="26" y="262" font-size="10" fill="#1e3a8a">驻留 8 / 24 页（示意：4 层 × 6 专家）</text>
    <text x="26" y="280" font-size="10" fill="#1e3a8a">真实规模：32 层 × 8 专家 = 256 页</text>
    <text x="26" y="300" font-size="10" fill="#15803d">命中 → 直接算，零搬运</text>
    <text x="26" y="318" font-size="10" fill="#b91c1c">缺失 → 选槽位/淘汰 → 改页表 → 搬页</text>

    <!-- ============ ② GPU 槽位 ============ -->
    <rect x="318" y="76" width="298" height="256" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="467" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#166534">② GPU HBM 槽位池（容量 = slots）</text>
    <text x="467" y="114" text-anchor="middle" font-size="10.5" fill="#15803d">槽位地址固定，内容可替换：专家权重按槽位布局</text>

    <rect x="330" y="122" width="136" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="340" y="139" font-size="11" font-weight="bold" fill="#166534">S0</text>
    <text x="398" y="139" text-anchor="middle" font-size="10.5" fill="#14532d">(L0, E0)</text>
    <text x="456" y="139" text-anchor="end" font-size="9.5" fill="#15803d">t=42</text>
    <text x="340" y="157" font-size="9.5" fill="#166534">gate/up/down 三矩阵</text>

    <rect x="478" y="122" width="126" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="488" y="139" font-size="11" font-weight="bold" fill="#166534">S1</text>
    <text x="536" y="139" text-anchor="middle" font-size="10.5" fill="#14532d">(L0, E1)</text>
    <text x="594" y="139" text-anchor="end" font-size="9.5" fill="#15803d">t=39</text>
    <text x="488" y="157" font-size="9.5" fill="#166534">352 MB @BF16</text>

    <rect x="330" y="172" width="136" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="340" y="189" font-size="11" font-weight="bold" fill="#166534">S2</text>
    <text x="398" y="189" text-anchor="middle" font-size="10.5" fill="#14532d">(L0, E3)</text>
    <text x="456" y="189" text-anchor="end" font-size="9.5" fill="#15803d">t=35</text>
    <text x="340" y="207" font-size="9.5" fill="#166534">常驻热点专家</text>

    <rect x="478" y="172" width="126" height="44" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="488" y="189" font-size="11" font-weight="bold" fill="#991b1b">S3</text>
    <text x="536" y="189" text-anchor="middle" font-size="10.5" fill="#991b1b">(L1, E1)</text>
    <text x="594" y="189" text-anchor="end" font-size="9.5" fill="#dc2626">t=3</text>
    <text x="488" y="207" font-size="9.5" fill="#991b1b">最久未用 → 淘汰对象</text>

    <rect x="330" y="222" width="136" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="340" y="239" font-size="11" font-weight="bold" fill="#166534">S4</text>
    <text x="398" y="239" text-anchor="middle" font-size="10.5" fill="#14532d">(L1, E2)</text>
    <text x="456" y="239" text-anchor="end" font-size="9.5" fill="#15803d">t=31</text>
    <text x="340" y="257" font-size="9.5" fill="#166534">命中 → 直接算</text>

    <rect x="478" y="222" width="126" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="488" y="239" font-size="11" font-weight="bold" fill="#166534">S5</text>
    <text x="536" y="239" text-anchor="middle" font-size="10.5" fill="#14532d">(L1, E4)</text>
    <text x="594" y="239" text-anchor="end" font-size="9.5" fill="#15803d">t=28</text>
    <text x="488" y="257" font-size="9.5" fill="#166534">跨请求共享</text>

    <rect x="330" y="272" width="136" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="340" y="289" font-size="11" font-weight="bold" fill="#166534">S6</text>
    <text x="398" y="289" text-anchor="middle" font-size="10.5" fill="#14532d">(L2, E0)</text>
    <text x="456" y="289" text-anchor="end" font-size="9.5" fill="#15803d">t=24</text>
    <text x="340" y="307" font-size="9.5" fill="#166534">被所有 token 复用</text>

    <rect x="478" y="272" width="126" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="488" y="289" font-size="11" font-weight="bold" fill="#166534">S7</text>
    <text x="536" y="289" text-anchor="middle" font-size="10.5" fill="#14532d">(L0, E5)</text>
    <text x="594" y="289" text-anchor="end" font-size="9.5" fill="#15803d">t=21</text>
    <text x="488" y="307" font-size="9.5" fill="#166534">槽位满 → 需淘汰</text>

    <text x="330" y="328" font-size="9.5" fill="#166534">slots 越多 → miss 越少 → 停顿越少</text>

    <!-- ============ ③ DRAM / NVMe ============ -->
    <rect x="632" y="76" width="312" height="256" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="788" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5b21b6">③ CPU/DRAM 专家仓库 + NVMe 冷备</text>
    <text x="788" y="114" text-anchor="middle" font-size="10.5" fill="#7c3aed">显存之外的完整副本（offload 的落点）</text>

    <rect x="646" y="126" width="284" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="662" y="146" font-size="11.5" font-weight="bold" fill="#1e40af">DRAM：全部 256 页（32 层 × 8 专家）</text>
    <text x="662" y="166" font-size="10.5" fill="#1e40af">≈ 45.1 G 参数 = 90.2 GB @BF16</text>
    <text x="662" y="185" font-size="10.5" fill="#1e40af">容量够大，但要过 PCIe：25 GB/s</text>
    <text x="662" y="204" font-size="10.5" fill="#1e40af">单专家 352 MB → 14.1 ms；全量 → 3.6 s</text>

    <rect x="646" y="248" width="284" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="662" y="268" font-size="11.5" font-weight="bold" fill="#5b21b6">NVMe：冷专家 / 多模型权重库</text>
    <text x="662" y="287" font-size="10.5" fill="#6d28d9">TB 级容量，≈7 GB/s，单专家 ≈50 ms</text>
    <text x="662" y="305" font-size="10.5" fill="#6d28d9">只在冷启动、换模型、换任务时用</text>

    <path d="M742 222 L742 248" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrPurple)"/>
    <path d="M834 248 L834 222" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrPurple)"/>
    <text x="788" y="240" text-anchor="middle" font-size="9.5" fill="#6d28d9">换入 ↑ / 换出 ↓</text>
    <text x="646" y="326" font-size="9.5" fill="#5b21b6">专家页身兼两职；KV 页没有磁盘层</text>

    <!-- ============ PCIe 通道 ============ -->
    <rect x="16" y="346" width="928" height="68" rx="10" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
    <text x="470" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af"
          paint-order="stroke" stroke="#fef9c3" stroke-width="5">缺页搬入：352 MB ÷ 25 GB·s⁻¹ ≈ 14.1 ms —— 这段时间 SM 只能 stall 等</text>
    <path d="M700 377 L214 377" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <path d="M244 406 L686 406" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
    <text x="470" y="394" text-anchor="middle" font-size="9.5" fill="#475569"
          paint-order="stroke" stroke="#fef9c3" stroke-width="4">淘汰写回 / 直接丢弃重算（复用同一条通道）</text>

    <!-- ============ 图例 ============ -->
    <rect x="16" y="426" width="928" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="26" y="432" width="14" height="12" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="46" y="444" font-size="10.5" fill="#334155">驻留命中</text>
    <rect x="126" y="432" width="14" height="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="146" y="444" font-size="10.5" fill="#334155">缺页（-1）</text>
    <rect x="236" y="432" width="14" height="12" fill="#fecaca" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="256" y="444" font-size="10.5" fill="#334155">LRU 淘汰对象（最小 t）</text>
    <path d="M424 438 L458 438" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="466" y="444" font-size="10.5" fill="#334155">PCIe 搬入</text>
    <path d="M552 438 L586 438" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
    <text x="594" y="444" font-size="10.5" fill="#334155">写回 / 丢弃</text>
    <path d="M690 438 L724 438" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrPurple)"/>
    <text x="732" y="444" font-size="10.5" fill="#334155">DRAM ↔ NVMe 换层</text>

    <!-- ============ 生命周期对照 ============ -->
    <text x="16" y="468" font-size="12.5" font-weight="bold" fill="#0f172a">同一个「页」抽象，两套生命周期（面试最爱问的对照点）：</text>
    <text x="16" y="490" font-size="11.5" fill="#1e40af">• KV 页 —— 按请求分配：序列独占自己的页，长度随 decode 线性增长，请求结束即回收；碎片是主要敌人</text>
    <text x="16" y="512" font-size="11.5" fill="#166534">• 专家页 —— 按 (层, 下标) 分配：跨请求全局共享，权重只读无需写回，随 batch 热度起伏反复换入换出；停顿是主要敌人</text>
    <text x="16" y="534" font-size="11.5" font-weight="bold" fill="#b91c1c">⇒ KV 分页优化「显存浪费」，专家分页优化「PCIe 停顿」：同一个页表思想，淘汰策略的目标函数不同。</text>
  </g>
</svg>
