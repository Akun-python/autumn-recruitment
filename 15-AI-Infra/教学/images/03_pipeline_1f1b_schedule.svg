<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="750" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#0f172a">Pipeline Parallel：1F1B 调度与 Bubble</text><text x="750" y="82" text-anchor="middle" font-size="21" fill="#475569">每个 stage 交替执行 Forward / Backward，减少流水线空转</text><text x="80" y="145" font-size="24" font-weight="bold">时间 →</text><g font-size="19" text-anchor="middle"><text x="180" y="190">t0</text><text x="300" y="190">t1</text><text x="420" y="190">t2</text><text x="540" y="190">t3</text><text x="660" y="190">t4</text><text x="780" y="190">t5</text><text x="900" y="190">t6</text><text x="1020" y="190">t7</text><text x="1140" y="190">t8</text><text x="1260" y="190">t9</text></g><g font-size="22"><text x="80" y="255">Stage 0</text><text x="80" y="375">Stage 1</text><text x="80" y="495">Stage 2</text><text x="80" y="615">Stage 3</text></g><g stroke="#334155" stroke-width="2" fill="#bfdbfe"><rect x="130" y="220" width="100" height="65" rx="8"/><rect x="250" y="220" width="100" height="65" rx="8"/><rect x="370" y="220" width="100" height="65" rx="8"/><rect x="490" y="220" width="100" height="65" rx="8"/><rect x="610" y="220" width="100" height="65" rx="8" fill="#fecaca"/><rect x="730" y="220" width="100" height="65" rx="8" fill="#fecaca"/><rect x="850" y="220" width="100" height="65" rx="8" fill="#fecaca"/><rect x="970" y="220" width="100" height="65" rx="8" fill="#fecaca"/><rect x="1090" y="220" width="100" height="65" rx="8" fill="#fecaca"/></g><g stroke="#334155" stroke-width="2"><rect x="250" y="340" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="370" y="340" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="490" y="340" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="610" y="340" width="100" height="65" rx="8" fill="#fecaca"/><rect x="730" y="340" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="850" y="340" width="100" height="65" rx="8" fill="#fecaca"/><rect x="970" y="340" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="1090" y="340" width="100" height="65" rx="8" fill="#fecaca"/></g><g stroke="#334155" stroke-width="2"><rect x="370" y="460" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="490" y="460" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="610" y="460" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="730" y="460" width="100" height="65" rx="8" fill="#fecaca"/><rect x="850" y="460" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="970" y="460" width="100" height="65" rx="8" fill="#fecaca"/></g><g stroke="#334155" stroke-width="2"><rect x="490" y="580" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="610" y="580" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="730" y="580" width="100" height="65" rx="8" fill="#bfdbfe"/><rect x="850" y="580" width="100" height="65" rx="8" fill="#fecaca"/><rect x="970" y="580" width="100" height="65" rx="8" fill="#bfdbfe"/></g><g font-size="20" text-anchor="middle"><text x="180" y="260">F1</text><text x="300" y="260">F2</text><text x="420" y="260">F3</text><text x="540" y="260">F4</text><text x="660" y="260">B4</text><text x="780" y="260">B3</text><text x="900" y="260">B2</text><text x="1020" y="260">B1</text><text x="1140" y="260">B0</text><text x="300" y="380">F1</text><text x="420" y="380">F2</text><text x="540" y="380">F3</text><text x="660" y="380">B4</text><text x="780" y="380">F4</text><text x="900" y="380">B3</text><text x="1020" y="380">F3</text><text x="1140" y="380">B2</text><text x="420" y="500">F1</text><text x="540" y="500">F2</text><text x="660" y="500">F3</text><text x="780" y="500">F4</text><text x="900" y="500">B3</text><text x="1020" y="500">F3</text><text x="540" y="620">F1</text><text x="660" y="620">F2</text><text x="780" y="620">F3</text><text x="900" y="620">F4</text><text x="1020" y="620">B3</text></g><text x="750" y="725" text-anchor="middle" font-size="24" fill="#334155">Bubble 比例近似： (P−1) / (m + P − 1)，增加 micro-batch 数 m 可降低空转比例</text><text x="750" y="765" text-anchor="middle" font-size="21" fill="#64748b">蓝色 F=Forward，红色 B=Backward；真实 1F1B 会按依赖关系交错执行</text></g></svg>