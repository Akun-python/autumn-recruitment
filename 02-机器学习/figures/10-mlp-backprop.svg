<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="fw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e86de"/>
    </marker>
    <marker id="bw" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#e74c3c"/>
    </marker>
  </defs>
  <rect width="860" height="460" fill="#fafbfc"/>
  <!-- ===== 输入层 ===== -->
  <circle cx="90" cy="160" r="24" fill="#d6eaf8" stroke="#2e86de" stroke-width="2"/>
  <text x="90" y="166" font-size="16" fill="#1a5276" text-anchor="middle">x₁</text>
  <circle cx="90" cy="300" r="24" fill="#d6eaf8" stroke="#2e86de" stroke-width="2"/>
  <text x="90" y="306" font-size="16" fill="#1a5276" text-anchor="middle">x₂</text>
  <text x="90" y="370" font-size="14" fill="#666" text-anchor="middle">输入层</text>
  <!-- ===== 隐层 ===== -->
  <g>
    <circle cx="360" cy="70" r="24" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
    <text x="360" y="76" font-size="15" fill="#935116" text-anchor="middle">h₁</text>
    <circle cx="360" cy="170" r="24" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
    <text x="360" y="176" font-size="15" fill="#935116" text-anchor="middle">h₂</text>
    <circle cx="360" cy="270" r="24" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
    <text x="360" y="276" font-size="15" fill="#935116" text-anchor="middle">h₃</text>
    <circle cx="360" cy="370" r="24" fill="#fdebd0" stroke="#e67e22" stroke-width="2"/>
    <text x="360" y="376" font-size="15" fill="#935116" text-anchor="middle">h₄</text>
  </g>
  <text x="360" y="430" font-size="14" fill="#666" text-anchor="middle">隐层（σ 激活）</text>
  <!-- ===== 输出层 ===== -->
  <circle cx="620" cy="220" r="26" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.5"/>
  <text x="620" y="226" font-size="17" fill="#1e8449" text-anchor="middle">ŷ</text>
  <text x="620" y="290" font-size="14" fill="#666" text-anchor="middle">输出层</text>
  <!-- ===== 前向连线（蓝实线）===== -->
  <g stroke="#2e86de" stroke-width="2">
    <line x1="114" y1="160" x2="336" y2="70" marker-end="url(#fw)"/>
    <line x1="114" y1="160" x2="336" y2="170" marker-end="url(#fw)"/>
    <line x1="114" y1="160" x2="336" y2="270" marker-end="url(#fw)"/>
    <line x1="114" y1="160" x2="336" y2="370" marker-end="url(#fw)"/>
    <line x1="114" y1="300" x2="336" y2="70" marker-end="url(#fw)"/>
    <line x1="114" y1="300" x2="336" y2="170" marker-end="url(#fw)"/>
    <line x1="114" y1="300" x2="336" y2="270" marker-end="url(#fw)"/>
    <line x1="114" y1="300" x2="336" y2="370" marker-end="url(#fw)"/>
    <line x1="384" y1="70" x2="594" y2="220" marker-end="url(#fw)"/>
    <line x1="384" y1="170" x2="594" y2="220" marker-end="url(#fw)"/>
    <line x1="384" y1="270" x2="594" y2="220" marker-end="url(#fw)"/>
    <line x1="384" y1="370" x2="594" y2="220" marker-end="url(#fw)"/>
  </g>
  <!-- ===== 反向传播（红虚线，弧线绕开前向直线，箭头指向误差回传方向）===== -->
  <g stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" fill="none">
    <path d="M594,220 C560,320 400,88 380,57" marker-end="url(#bw)"/>
    <path d="M594,220 C560,310 400,188 380,157" marker-end="url(#bw)"/>
    <path d="M594,220 C560,295 400,288 380,257" marker-end="url(#bw)"/>
    <path d="M594,220 C560,290 400,388 380,357" marker-end="url(#bw)"/>
    <path d="M336,70 C280,92 170,124 114,156" marker-end="url(#bw)"/>
    <path d="M336,170 C260,140 160,150 114,158" marker-end="url(#bw)"/>
    <path d="M336,270 C260,322 160,282 114,298" marker-end="url(#bw)"/>
    <path d="M336,370 C260,402 160,312 114,296" marker-end="url(#bw)"/>
  </g>
  <!-- 标签 -->
  <rect x="520" y="30" width="160" height="34" rx="8" fill="#d6eaf8" stroke="#2e86de"/>
  <text x="600" y="52" font-size="15" fill="#1a5276" text-anchor="middle" font-weight="bold">前向传播</text>
  <rect x="560" y="322" width="220" height="34" rx="8" fill="#fadbd8" stroke="#e74c3c"/>
  <text x="670" y="344" font-size="15" fill="#922b21" text-anchor="middle" font-weight="bold">反向传播（误差回传）</text>
  <text x="670" y="378" font-size="13" fill="#922b21" text-anchor="middle">δ₂=(ŷ−y)·σ′(z₂)，δ₁=(W₂ᵀδ₂)⊙σ′(z₁)</text>
  <text x="670" y="398" font-size="13" fill="#922b21" text-anchor="middle">∂L/∂W₂=δ₂hᵀ，∂L/∂W₁=δ₁xᵀ</text>
  <!-- 顶部 -->
  <text x="430" y="24" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">两层神经网络：蓝线 = 前向传播，红线 = 反向传播</text>
</svg>