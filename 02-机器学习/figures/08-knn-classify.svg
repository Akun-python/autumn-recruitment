<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="430" fill="#fafbfc"/>
  <!-- 浅网格 -->
  <g stroke="#e4e7eb" stroke-width="1">
    <line x1="0" y1="60" x2="820" y2="60"/><line x1="0" y1="120" x2="820" y2="120"/>
    <line x1="0" y1="180" x2="820" y2="180"/><line x1="0" y1="240" x2="820" y2="240"/>
    <line x1="0" y1="300" x2="820" y2="300"/><line x1="0" y1="360" x2="820" y2="360"/>
    <line x1="137" y1="0" x2="137" y2="430"/><line x1="274" y1="0" x2="274" y2="430"/>
    <line x1="411" y1="0" x2="411" y2="430"/><line x1="548" y1="0" x2="548" y2="430"/>
    <line x1="685" y1="0" x2="685" y2="430"/>
  </g>
  <!-- 类1：红色簇 -->
  <g fill="#e74c3c">
    <circle cx="150" cy="150" r="6"/><circle cx="185" cy="120" r="6"/><circle cx="120" cy="185" r="6"/>
    <circle cx="210" cy="165" r="6"/><circle cx="160" cy="105" r="6"/><circle cx="230" cy="130" r="6"/>
    <circle cx="135" cy="135" r="6"/><circle cx="195" cy="195" r="6"/>
  </g>
  <!-- 类2：绿色簇 -->
  <g fill="#2ecc71">
    <circle cx="620" cy="120" r="6"/><circle cx="655" cy="150" r="6"/><circle cx="590" cy="165" r="6"/>
    <circle cx="670" cy="185" r="6"/><circle cx="640" cy="105" r="6"/><circle cx="700" cy="140" r="6"/>
    <circle cx="605" cy="195" r="6"/><circle cx="680" cy="160" r="6"/>
  </g>
  <!-- 类3：蓝色簇 -->
  <g fill="#3498db">
    <circle cx="380" cy="330" r="6"/><circle cx="420" cy="310" r="6"/><circle cx="350" cy="300" r="6"/>
    <circle cx="450" cy="350" r="6"/><circle cx="410" cy="360" r="6"/><circle cx="480" cy="320" r="6"/>
    <circle cx="370" cy="360" r="6"/><circle cx="440" cy="290" r="6"/>
  </g>
  <!-- 查询点 -->
  <circle cx="492" cy="232" r="11" fill="#111" stroke="#fff" stroke-width="2"/>
  <text x="492" y="258" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">新样本 x</text>
  <!-- k=5 最近邻圈 -->
  <circle cx="492" cy="232" r="120" fill="none" stroke="#f39c12" stroke-width="2.5" stroke-dasharray="8,5"/>
  <!-- 圈内邻居高亮环 -->
  <g fill="none" stroke="#f39c12" stroke-width="3">
    <circle cx="555" cy="140" r="10"/><circle cx="585" cy="190" r="10"/><circle cx="600" cy="225" r="10"/>
    <circle cx="480" cy="135" r="10"/><circle cx="530" cy="300" r="10"/>
  </g>
  <!-- 邻居连线 -->
  <g stroke="#999" stroke-width="1.2">
    <line x1="492" y1="232" x2="555" y2="140"/><line x1="492" y1="232" x2="585" y2="190"/>
    <line x1="492" y1="232" x2="600" y2="225"/><line x1="492" y1="232" x2="480" y2="135"/>
    <line x1="492" y1="232" x2="530" y2="300"/>
  </g>
  <!-- 图例 -->
  <rect x="20" y="20" width="330" height="74" rx="8" fill="#fff" stroke="#d0d7de"/>
  <circle cx="45" cy="40" r="5" fill="#e74c3c"/><text x="58" y="45" font-size="14" fill="#333">类 A</text>
  <circle cx="110" cy="40" r="5" fill="#2ecc71"/><text x="123" y="45" font-size="14" fill="#333">类 B</text>
  <circle cx="175" cy="40" r="5" fill="#3498db"/><text x="188" y="45" font-size="14" fill="#333">类 C</text>
  <circle cx="255" cy="40" r="8" fill="#111"/><text x="275" y="45" font-size="14" fill="#333">查询点</text>
  <line x1="40" y1="68" x2="90" y2="68" stroke="#f39c12" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="102" y="72" font-size="14" fill="#333">k=5 最近邻圈</text>
  <!-- 说明 -->
  <text x="492" y="380" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">5 个邻居投票：绿色 3 票 &gt; 红色 2 票 → x 判为类 B</text>
  <text x="492" y="405" font-size="13" fill="#666" text-anchor="middle">（KNN 三步：算距离 → 取最近 k 个 → 多数投票；虚线圆内即 Nₖ(x)）</text>
</svg>
